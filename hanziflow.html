<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉字魔法城 · 笔顺练习</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pinyin-pro/3.29.3/index.min.js"></script>
<style>
  :root{
    --pink:#ff8fab; --peach:#ffd6a5; --sky:#a0e7e5; --mint:#b4f8c8;
    --purple:#c9b6ff; --ink:#3c3c50; --paper:#fffaf3; --soft:#7a7a90;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
    background:linear-gradient(160deg,#fff0e5 0%,#eaf6ff 50%,#f3ecff 100%);
    color:var(--ink);
    height:100dvh; max-height:100dvh;
    overflow:hidden;
    display:flex; flex-direction:column;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  }

  .chrome{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    max-width:900px; width:100%; margin:0 auto 6px;
  }
  .home{
    text-decoration:none; color:#fff; font-weight:700; font-size:12px;
    background:rgba(0,0,0,.22); border:2px solid rgba(255,255,255,.35);
    border-radius:999px; padding:7px 12px; white-space:nowrap;
  }
  h1{ font-size:clamp(16px,4vw,22px); margin:0; flex:1; text-align:center;}
  .progress{
    font-size:12px; font-weight:800; color:#8a6fd8;
    background:#f3ecff; border-radius:999px; padding:5px 10px; white-space:nowrap;
  }
  .mode-tabs{
    flex:0 0 auto;
    display:flex; gap:6px; max-width:900px; width:100%; margin:0 auto 6px;
  }
  .mode-tabs button{
    flex:1; border:none; border-radius:12px; padding:9px 8px; font-size:14px; font-weight:800;
    background:#fff; color:#9a9ab0; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,0.06);
  }
  .mode-tabs button.on{ background:var(--purple); color:#fff; }

  .screen{
    flex:1 1 auto; min-height:0;
    max-width:900px; width:100%; margin:0 auto;
    display:flex; flex-direction:column; gap:6px;
  }

  .stage-card{
    flex:1 1 auto; min-height:0;
    background:var(--paper); border-radius:18px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    padding:8px 10px;
    display:flex; flex-direction:column; gap:6px;
  }

  .stage-top{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .pinyin-big{ font-size:clamp(18px,4vw,26px); color:#8a6fd8; font-weight:800; min-height:28px;}
  .char-hint{
    flex:0 0 auto;
    font-size:12px; color:var(--soft); text-align:center;
    min-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .stage-row{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:stretch; justify-content:center; gap:10px;
  }
  .writer-wrap{
    flex:1 1 auto; min-width:0; min-height:0;
    display:flex; align-items:center; justify-content:center;
  }
  #target{
    background:
      repeating-linear-gradient(0deg,transparent,transparent 28px,#eee 28px,#eee 29px),
      repeating-linear-gradient(90deg,transparent,transparent 28px,#eee 28px,#eee 29px), #fff;
    border:3px solid var(--purple); border-radius:16px;
    touch-action:none;
  }

  .stroke-panel{
    flex:0 0 clamp(88px, 22vw, 120px);
    min-height:0;
    background:linear-gradient(180deg,#f7f2ff,#fff8ef);
    border:2px solid #e0d4ff; border-radius:14px;
    padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .stroke-panel .sp-title{ font-size:12px; font-weight:800; color:#7a4fd6;}
  .stroke-panel .sp-count{
    font-size:16px; font-weight:900; color:#3c3c50;
    font-variant-numeric:tabular-nums;
  }
  .stroke-panel .sp-count b{ color:#ff8fab; font-size:20px;}
  .stroke-list{
    width:100%; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; gap:5px;
    overflow-y:auto; padding:2px;
  }
  .stroke-item{
    display:flex; align-items:center; justify-content:center;
    min-height:30px; border-radius:10px; font-size:12px; font-weight:800;
    background:#fff; color:#9a9ab0; border:2px solid #eee;
    flex:0 0 auto;
  }
  .stroke-item.done{ background:#e8fcec; color:#1a7a3a; border-color:#b4f8c8;}
  .stroke-item.now{
    background:#ff8fab; color:#fff; border-color:#ff8fab;
    box-shadow:0 2px 8px rgba(255,143,171,.4);
  }
  .stroke-item.miss{ background:#ffe0d8; color:#a6382a; border-color:#f39a8d;}

  .toolbar{
    flex:0 0 auto;
    display:flex; flex-direction:column; gap:6px;
  }
  .big-row, .nav-row, .speed-row{
    display:flex; gap:6px; width:100%; justify-content:center; align-items:center; flex-wrap:nowrap;
  }
  .big-btn{
    flex:1; min-height:42px; border:none; border-radius:12px;
    font-size:14px; font-weight:800; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.1);
  }
  .big-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.1);}
  .big-btn.pink{ background:var(--pink); color:#fff;}
  .big-btn.sky{ background:var(--sky); color:#12505a;}
  .big-btn.mint{ background:var(--mint); color:#1a5c3a;}
  .big-btn.peach{ background:var(--peach); color:#8a3d00;}
  .big-btn.on{ outline:3px solid #7a4fd6; outline-offset:1px;}
  .speed-row .chip, .chip{
    border:none; border-radius:999px; padding:8px 12px; font-size:12px; font-weight:800;
    background:#fff; color:#7a7a90; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.08);
    white-space:nowrap;
  }
  .speed-row .chip.on{ background:#7a4fd6; color:#fff;}

  .passage-dock{
    flex:0 0 auto;
    height:min(118px, 22vh);
    background:var(--paper); border-radius:16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    padding:6px 10px 8px;
    display:flex; flex-direction:column; min-height:0;
  }
  .passage-dock .dock-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:4px;
  }
  .passage-dock .tip{ font-size:11px; color:var(--soft); margin:0; font-weight:700;}
  .passage-dock .linkish{
    border:none; background:#eef; color:#5c5c72; font-size:12px; font-weight:800;
    border-radius:999px; padding:5px 10px; cursor:pointer;
  }
  .passage{
    flex:1 1 auto; min-height:0; overflow:auto;
    font-size:clamp(16px, 3.8vw, 20px); line-height:2.1; letter-spacing:1px;
    -webkit-overflow-scrolling:touch;
  }
  .passage p{ margin:0 0 6px; }
  .ruby-word{
    display:inline-flex; flex-direction:column; align-items:center;
    margin:0 1px; vertical-align:bottom; cursor:pointer;
  }
  .py{ font-size:10px; color:#8a6fd8; line-height:1; height:12px; }
  .hz{
    transition:all .15s ease; border-radius:6px; padding:1px 3px;
    border:2px solid transparent;
  }
  .hz.active{ background:var(--pink); color:#fff; box-shadow:0 2px 8px rgba(255,143,171,.55);}
  .hz.done{ border-color:#b4f8c8; background:#f0fff5;}
  .punct{ color:#b7b7c8; cursor:default;}

  /* reading screen */
  .read-card{
    flex:0 0 auto;
    background:var(--paper); border-radius:16px; padding:10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .rate-row{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--soft);}
  .read-status{ font-size:12px; color:var(--soft); min-height:16px; text-align:center;}
  .read-status.warn{ color:#c45c26; font-weight:700;}
  .controls{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .controls button{
    border:none; border-radius:999px; padding:10px 16px; font-size:14px; font-weight:800;
    background:var(--sky); color:#12505a; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.1);
  }
  .controls button.primary{ background:var(--pink); color:#fff;}

  /* article modal */
  .modal{
    position:fixed; inset:0; z-index:40;
    background:rgba(40,30,50,.45);
    display:flex; align-items:flex-end; justify-content:center;
    padding:12px;
  }
  .modal-card{
    width:min(560px, 100%);
    background:var(--paper); border-radius:18px; padding:14px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    max-height:min(70dvh, 520px); overflow:auto;
  }
  .modal-card h3{ margin:0 0 8px; font-size:16px;}
  .modal-card textarea{
    width:100%; min-height:90px; border-radius:12px; border:2px solid var(--mint);
    padding:10px; font-size:14px; font-family:inherit; resize:vertical;
  }
  .input-row{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .input-row button, .preset-row button{
    border:none; border-radius:999px; padding:9px 14px; font-size:13px; font-weight:700;
    cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.1);
  }
  button.primary{ background:var(--pink); color:#fff;}
  button.ghost{ background:#fff; color:#5c5c72;}
  .preset-row{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
  .preset-row button{ background:var(--sky); color:#12505a;}

  .hidden{ display:none !important; }

  @media (max-height:700px){
    .big-btn{ min-height:38px; font-size:13px;}
    .passage-dock{ height:min(100px, 20vh);}
  }
</style>
</head>
<body>

<div class="chrome">
  <a class="home" href="index.html">← 乐园</a>
  <h1>🏰 汉字魔法城</h1>
  <div class="progress" id="progressLabel">准备好啦</div>
</div>

<div class="mode-tabs">
  <button id="tabPractice" class="on">✏️ 练字</button>
  <button id="tabRead">📖 听故事</button>
  <button type="button" id="btnOpenArticle" class="chip" style="flex:0 0 auto;box-shadow:none;background:#fff8ef;">📝 换文</button>
</div>

<!-- PRACTICE: single screen -->
<section class="screen" id="practicePanel">
  <div class="stage-card">
    <div class="stage-top">
      <div class="pinyin-big" id="pinyinBig"></div>
    </div>
    <div class="stage-row">
      <div class="writer-wrap" id="writerWrap">
        <div id="target"></div>
      </div>
      <aside class="stroke-panel" aria-live="polite">
        <div class="sp-title">笔画</div>
        <div class="sp-count" id="strokeCount"><b>0</b> / 0</div>
        <div class="stroke-list" id="strokeList"></div>
      </aside>
    </div>
    <div class="char-hint" id="charHint">点下面的字开始练</div>

    <div class="toolbar">
      <div class="big-row" id="modeRow">
        <button type="button" class="big-btn peach on" id="btnWatch">👀 看笔顺</button>
        <button type="button" class="big-btn mint" id="btnWrite">✍️ 我来写</button>
      </div>
      <div class="nav-row">
        <button type="button" class="big-btn sky" id="btnPrev">◀ 上一个</button>
        <button type="button" class="big-btn pink" id="btnReplay">🔁 再来</button>
        <button type="button" class="big-btn sky" id="btnNext">下一个 ▶</button>
      </div>
      <div class="speed-row" id="speedRow">
        <button type="button" class="chip" data-speed="1.6">慢</button>
        <button type="button" class="chip on" data-speed="0.9">中</button>
        <button type="button" class="chip" data-speed="0.45">快</button>
        <button type="button" class="chip" id="btnSpeak">🔊 读</button>
      </div>
    </div>
  </div>

</section>

<!-- READING: compact controls (shares passage dock below) -->
<section class="screen hidden" id="readPanel">
  <div class="read-card" style="flex:1 1 auto;">
    <div style="font-size:36px;margin-top:8px;">📖</div>
    <div class="controls">
      <button class="primary" id="readBtn">▶️ 开始朗读</button>
      <button id="stopReadBtn">⏹ 停止</button>
    </div>
    <div class="rate-row">
      语速
      <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.9">
      <span id="rateLabel">0.9×</span>
    </div>
    <div class="read-status" id="readStatus">点开始听故事</div>
  </div>
</section>

<!-- shared passage: always on screen -->
<div class="passage-dock" id="passageCard" style="max-width:900px;width:100%;margin:0 auto;">
  <div class="dock-bar">
    <p class="tip" id="passageTip">点汉字练习笔顺</p>
  </div>
  <div class="passage" id="passage"></div>
</div>

<div class="modal hidden" id="articleModal">
  <div class="modal-card">
    <h3>📝 换一篇练习</h3>
    <div class="preset-row">
      <button type="button" data-preset="short">短句练习</button>
      <button type="button" data-preset="share">分享小故事</button>
      <button type="button" data-preset="animals">动物字</button>
    </div>
    <textarea id="articleInput" placeholder="粘贴或输入一篇文章…"></textarea>
    <div class="input-row">
      <button class="primary" id="genBtn">✨ 开始练</button>
      <button class="ghost" id="clearBtn">清空</button>
      <button class="ghost" id="closeModalBtn">关闭</button>
    </div>
  </div>
</div>

<script>
const isHanzi = ch => /[\u4e00-\u9fff]/.test(ch);

const PRESETS = {
  short: '春天来了，花儿开了。小鸟在树上唱歌。我喜欢和小朋友一起玩。',
  share: '星期六下午，我和妹妹在家里玩积木。妈妈说："好东西要和别人分享。"我把积木分给妹妹，我们一起把城堡搭得更漂亮。',
  animals: '猫狗鸟鱼马牛羊鸡鸭兔龙虎熊狮象'
};

let sequence = []; // {char, py, wordEl, isHanzi}
let hanziIndexes = []; // indices into sequence that are hanzi
let curHanziPos = 0;   // position within hanziIndexes
let practiceMode = 'watch'; // watch | write
let secondsPerStroke = 0.9;
let mode = 'practice';
let writer = null;
let playToken = 0;
let doneSet = new Set();

let reading = false;
let pausedReading = false;
let chineseVoice = null;
let keepAliveTimer = null;
let highlightTimer = null;
let speakToken = 0;
let sentenceQueue = [];
let sentencePos = 0;

const passageEl = document.getElementById('passage');
const pinyinBigEl = document.getElementById('pinyinBig');
const charHintEl = document.getElementById('charHint');
const progressLabel = document.getElementById('progressLabel');
const targetEl = document.getElementById('target');
const strokeCountEl = document.getElementById('strokeCount');
const strokeListEl = document.getElementById('strokeList');
const readBtn = document.getElementById('readBtn');
const readStatus = document.getElementById('readStatus');
const rateRange = document.getElementById('rateRange');
const rateLabel = document.getElementById('rateLabel');
const btnWatch = document.getElementById('btnWatch');
const btnWrite = document.getElementById('btnWrite');
const speedRow = document.getElementById('speedRow');

let strokeTotal = 0;
let strokeDone = 0; // completed strokes (0..total)

function setReadStatus(text, warn){
  readStatus.textContent = text;
  readStatus.className = 'read-status' + (warn ? ' warn' : '');
}

function pickChineseVoice(){
  if (!('speechSynthesis' in window)) { chineseVoice = null; return null; }
  const voices = speechSynthesis.getVoices() || [];
  chineseVoice = voices.find(v => /zh-CN/i.test(v.lang))
    || voices.find(v => /^zh/i.test(v.lang) || /chinese|中文|普通话/i.test(v.name))
    || null;
  return chineseVoice;
}
if ('speechSynthesis' in window) {
  pickChineseVoice();
  speechSynthesis.onvoiceschanged = () => pickChineseVoice();
}

function speakChar(ch){
  if (!('speechSynthesis' in window) || !ch) return;
  pickChineseVoice();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(ch);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  if (chineseVoice) u.voice = chineseVoice;
  setTimeout(() => speechSynthesis.speak(u), 40);
}

function stopSpeechKeepAlive(){
  if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
}
function startSpeechKeepAlive(){
  stopSpeechKeepAlive();
  keepAliveTimer = setInterval(() => {
    if (!reading || pausedReading) return;
    try { speechSynthesis.pause(); speechSynthesis.resume(); } catch (e) {}
  }, 8000);
}

function stopReading(resetButton){
  speakToken++;
  clearTimeout(highlightTimer);
  stopSpeechKeepAlive();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  reading = false;
  pausedReading = false;
  sentenceQueue = [];
  sentencePos = 0;
  if (resetButton !== false) readBtn.textContent = '▶️ 开始朗读';
  clearActive();
}

function clearActive(){
  sequence.forEach(s => s.wordEl.classList.remove('active'));
}

function setActiveSeq(i){
  clearActive();
  const item = sequence[i];
  if (!item) return;
  item.wordEl.classList.add('active');
}

function updateProgress(){
  const total = hanziIndexes.length;
  if (!total) {
    progressLabel.textContent = '还没有汉字';
    return;
  }
  const n = curHanziPos + 1;
  const done = doneSet.size;
  progressLabel.textContent = `第 ${n} / ${total} 个字 · 已练 ${done} 个`;
}

function currentItem(){
  if (!hanziIndexes.length) return null;
  const seqI = hanziIndexes[curHanziPos];
  return sequence[seqI] || null;
}

const BASE_STROKE_MS = 400;
function paceParams(secPerStroke){
  const totalPerStrokeMs = secPerStroke * 1000;
  const drawMs = Math.max(totalPerStrokeMs * 0.55, 40);
  const delay = Math.max(totalPerStrokeMs - drawMs, 40);
  const speed = Math.max(0.08, BASE_STROKE_MS / drawMs);
  return { speed, delay };
}

function resetStrokePanel(total){
  strokeTotal = total || 0;
  strokeDone = 0;
  renderStrokePanel(0, 'now');
}

function renderStrokePanel(doneCount, currentState){
  // doneCount = number of fully completed strokes
  // currentState: 'now' | 'miss' | null for the next stroke slot
  strokeDone = doneCount;
  const showCur = Math.min(doneCount + 1, strokeTotal || 0);
  strokeCountEl.innerHTML = strokeTotal
    ? `<b>${Math.min(showCur, strokeTotal)}</b> / ${strokeTotal}`
    : `<b>0</b> / 0`;

  if (!strokeTotal) {
    strokeListEl.innerHTML = '<div class="stroke-item">—</div>';
    return;
  }

  let html = '';
  for (let i = 0; i < strokeTotal; i++) {
    let cls = 'stroke-item';
    if (i < doneCount) cls += ' done';
    else if (i === doneCount && currentState === 'now') cls += ' now';
    else if (i === doneCount && currentState === 'miss') cls += ' miss';
    html += `<div class="${cls}" data-i="${i}">第 ${i + 1} 笔</div>`;
  }
  strokeListEl.innerHTML = html;

  const nowEl = strokeListEl.querySelector('.now, .miss');
  if (nowEl) {
    const top = nowEl.offsetTop - strokeListEl.clientHeight / 2 + nowEl.clientHeight / 2;
    strokeListEl.scrollTop = Math.max(0, top);
  }
}

function writerSize(){
  const wrap = document.getElementById('writerWrap');
  if (!wrap) return 200;
  const side = Math.min(wrap.clientWidth, wrap.clientHeight);
  return Math.max(140, Math.floor(side - 4));
}

function createWriter(char, speed, delay, forQuiz){
  targetEl.innerHTML = '';
  const size = writerSize();
  targetEl.style.width = size + 'px';
  targetEl.style.height = size + 'px';
  return HanziWriter.create(targetEl, char, {
    width: size, height: size, padding: 10,
    strokeAnimationSpeed: speed,
    delayBetweenStrokes: delay,
    strokeColor: '#7a4fd6',
    radicalColor: '#ff8fab',
    outlineColor: '#e5ddff',
    drawingColor: '#3c3c50',
    showOutline: true,
    showHintAfterMisses: forQuiz ? 1 : false,
    highlightOnComplete: true,
    leniency: 1.15
  });
}

function markDone(seqIndex){
  doneSet.add(seqIndex);
  const item = sequence[seqIndex];
  if (item) item.wordEl.classList.add('done');
  updateProgress();
}

function runWatch(){
  const item = currentItem();
  if (!item) return;
  const myToken = ++playToken;
  const { speed, delay } = paceParams(secondsPerStroke);
  writer = createWriter(item.char, speed, delay, false);
  pinyinBigEl.textContent = item.py || '';
  charHintEl.textContent = '看好右边笔画：现在写到第几笔';
  setActiveSeq(hanziIndexes[curHanziPos]);
  resetStrokePanel(0);

  writer.getCharacterData().then(data => {
    if (myToken !== playToken) return;
    const total = (data && data.strokes) ? data.strokes.length : 0;
    resetStrokePanel(total);
    if (!total) {
      charHintEl.textContent = '这个字暂时没有笔顺数据';
      return;
    }

    // Animate stroke-by-stroke so the right panel can update live
    let i = 0;
    const nextStroke = () => {
      if (myToken !== playToken) return;
      if (i >= total) {
        renderStrokePanel(total, null);
        markDone(hanziIndexes[curHanziPos]);
        charHintEl.textContent = '看完啦！可以点「我来写」，或「下一个」';
        return;
      }
      renderStrokePanel(i, 'now');
      charHintEl.textContent = `正在写第 ${i + 1} 笔（共 ${total} 笔）`;
      writer.animateStroke(i, {
        onComplete: () => {
          if (myToken !== playToken) return;
          i += 1;
          renderStrokePanel(i, i < total ? 'now' : null);
          setTimeout(() => {
            if (myToken !== playToken) return;
            nextStroke();
          }, delay);
        }
      });
    };
    nextStroke();
  }).catch(() => {
    if (myToken !== playToken) return;
    charHintEl.textContent = '笔顺加载失败，换一个字试试';
  });
}

function runWrite(){
  const item = currentItem();
  if (!item) return;
  const myToken = ++playToken;
  const { speed, delay } = paceParams(secondsPerStroke);
  writer = createWriter(item.char, speed, delay, true);
  pinyinBigEl.textContent = item.py || '';
  charHintEl.textContent = '用手指写；右边会显示写到第几笔';
  setActiveSeq(hanziIndexes[curHanziPos]);
  resetStrokePanel(0);

  writer.getCharacterData().then(data => {
    if (myToken !== playToken) return;
    const total = (data && data.strokes) ? data.strokes.length : 0;
    resetStrokePanel(total);
    renderStrokePanel(0, 'now');

    writer.quiz({
      onCorrectStroke: (strokeData) => {
        if (myToken !== playToken) return;
        // strokeNum is 0-based index of the stroke just completed
        const done = (strokeData && typeof strokeData.strokeNum === 'number')
          ? strokeData.strokeNum + 1
          : strokeDone + 1;
        const next = done < total ? 'now' : null;
        renderStrokePanel(done, next);
        charHintEl.textContent = done < total
          ? `写对啦！接着写第 ${done + 1} 笔`
          : '最后一笔写对啦！';
      },
      onMistake: (strokeData) => {
        if (myToken !== playToken) return;
        const cur = (strokeData && typeof strokeData.strokeNum === 'number')
          ? strokeData.strokeNum
          : strokeDone;
        renderStrokePanel(cur, 'miss');
        charHintEl.textContent = `第 ${cur + 1} 笔再试试～`;
      },
      onComplete: () => {
        if (myToken !== playToken) return;
        renderStrokePanel(total, null);
        markDone(hanziIndexes[curHanziPos]);
        charHintEl.textContent = '写对啦！真棒 🌟 可以练下一个';
        speakChar('真棒');
      }
    });
  }).catch(() => {
    if (myToken !== playToken) return;
    charHintEl.textContent = '笔顺加载失败，换一个字试试';
  });
}

function showCurrent(opts){
  const item = currentItem();
  if (!item) {
    targetEl.innerHTML = '';
    pinyinBigEl.textContent = '';
    charHintEl.textContent = '请先生成一篇有汉字的文章';
    resetStrokePanel(0);
    updateProgress();
    return;
  }
  updateProgress();
  setActiveSeq(hanziIndexes[curHanziPos]);
  if (opts && opts.speak) speakChar(item.char);
  if (practiceMode === 'write') runWrite();
  else runWatch();
}

function goHanzi(delta){
  if (!hanziIndexes.length) return;
  curHanziPos = (curHanziPos + delta + hanziIndexes.length) % hanziIndexes.length;
  showCurrent({ speak: true });
}

function jumpToSeq(seqIndex){
  if (mode !== 'practice') return;
  const pos = hanziIndexes.indexOf(seqIndex);
  if (pos < 0) return;
  curHanziPos = pos;
  showCurrent({ speak: true });
}

function buildFromText(rawText){
  stopReading();
  playToken++;
  doneSet.clear();
  passageEl.innerHTML = '';
  sequence = [];
  hanziIndexes = [];
  curHanziPos = 0;

  const paragraphs = rawText.split(/\n+/).filter(p => p.trim().length);
  const flatChars = [];
  paragraphs.forEach(p => { for (const ch of p) if (ch.trim()) flatChars.push(ch); });

  let pyArray = [];
  try {
    pyArray = pinyinPro.pinyin(flatChars.join(''), { type: 'array', toneType: 'symbol' });
  } catch (e) {
    pyArray = flatChars.map(() => '');
  }

  let flatI = 0;
  paragraphs.forEach(para => {
    const p = document.createElement('p');
    for (const ch of para) {
      if (!ch.trim()) continue;
      const hanzi = isHanzi(ch);
      const py = hanzi ? (pyArray[flatI] || '') : '';
      const wrap = document.createElement('span');
      wrap.className = 'ruby-word' + (hanzi ? ' hanzi' : '');
      const pySpan = document.createElement('span');
      pySpan.className = 'py';
      pySpan.textContent = py;
      const hzSpan = document.createElement('span');
      hzSpan.textContent = ch;
      hzSpan.className = hanzi ? 'hz' : 'hz punct';
      wrap.appendChild(pySpan);
      wrap.appendChild(hzSpan);
      p.appendChild(wrap);

      const seqIndex = sequence.length;
      if (hanzi) {
        wrap.addEventListener('click', () => jumpToSeq(seqIndex));
        hanziIndexes.push(seqIndex);
      }
      sequence.push({ char: ch, py, wordEl: hzSpan, isHanzi: hanzi });
      flatI++;
    }
    passageEl.appendChild(p);
  });

  updateProgress();
  if (hanziIndexes.length && mode === 'practice') {
    showCurrent({ speak: false });
    charHintEl.textContent = practiceMode === 'write'
      ? '用手指在格子里写这个字'
      : '点「看笔顺」或文章里的字开始练';
  } else {
    targetEl.innerHTML = '';
    pinyinBigEl.textContent = '';
  }
}

// ---- UI bindings ----
btnWatch.addEventListener('click', () => {
  practiceMode = 'watch';
  btnWatch.classList.add('on');
  btnWrite.classList.remove('on');
  speedRow.classList.remove('hidden');
  showCurrent({ speak: true });
});
btnWrite.addEventListener('click', () => {
  practiceMode = 'write';
  btnWrite.classList.add('on');
  btnWatch.classList.remove('on');
  showCurrent({ speak: true });
});

document.getElementById('btnPrev').addEventListener('click', () => goHanzi(-1));
document.getElementById('btnNext').addEventListener('click', () => goHanzi(1));
document.getElementById('btnReplay').addEventListener('click', () => showCurrent({ speak: true }));

speedRow.querySelectorAll('[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    speedRow.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    secondsPerStroke = parseFloat(btn.dataset.speed);
    if (practiceMode === 'watch') showCurrent({ speak: false });
  });

document.getElementById('btnSpeak').addEventListener('click', () => {
  const item = currentItem();
  if (item) speakChar(item.char);
});

const articleModal = document.getElementById('articleModal');
function openArticleModal(){ articleModal.classList.remove('hidden'); }
function closeArticleModal(){ articleModal.classList.add('hidden'); }

document.getElementById('btnOpenArticle').addEventListener('click', openArticleModal);
document.getElementById('closeModalBtn').addEventListener('click', closeArticleModal);
articleModal.addEventListener('click', (e) => {
  if (e.target === articleModal) closeArticleModal();
});

document.getElementById('genBtn').addEventListener('click', () => {
  const text = document.getElementById('articleInput').value.trim();
  if (!text) { alert('请先输入或选择一篇练习～'); return; }
  buildFromText(text);

  requestAnimationFrame(() => { if (mode === 'practice') showCurrent({ speak: false }); });
});
document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('articleInput').value = '';
  document.getElementById('articleInput').focus();
});
document.querySelectorAll('[data-preset]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.preset;
    document.getElementById('articleInput').value = PRESETS[key] || '';
    buildFromText(PRESETS[key]);
    closeArticleModal();
    requestAnimationFrame(() => { if (mode === 'practice') showCurrent({ speak: false }); });
  });
});

const tabPractice = document.getElementById('tabPractice');
const tabRead = document.getElementById('tabRead');
const practicePanel = document.getElementById('practicePanel');
const readPanel = document.getElementById('readPanel');

tabPractice.addEventListener('click', () => {
  if (mode === 'practice') return;
  mode = 'practice';
  tabPractice.classList.add('on'); tabRead.classList.remove('on');
  practicePanel.classList.remove('hidden');
  readPanel.classList.add('hidden');
  document.getElementById('passageTip').textContent = '点汉字练习笔顺';
  stopReading();
  requestAnimationFrame(() => showCurrent({ speak: false }));
});

tabRead.addEventListener('click', () => {
  if (mode === 'reading') return;
  mode = 'reading';
  tabRead.classList.add('on'); tabPractice.classList.remove('on');
  readPanel.classList.remove('hidden');
  practicePanel.classList.add('hidden');
  document.getElementById('passageTip').textContent = '朗读时会高亮当前字';
  playToken++;
  clearActive();
  pickChineseVoice();
  if (!('speechSynthesis' in window)) setReadStatus('当前浏览器不支持语音朗读', true);
  else if (!chineseVoice) setReadStatus('未检测到中文语音，仍可尝试', true);
  else setReadStatus('将使用：' + chineseVoice.name);
});

window.addEventListener('resize', () => {
  if (mode === 'practice' && currentItem()) {
    // keep current char, rebuild canvas to new size
    showCurrent({ speak: false });
  }
});

function splitIntoSentences(items){
  const chunks = [];
  let buf = '', start = 0;
  for (let i = 0; i < items.length; i++) {
    buf += items[i].char;
    if (/[。！？；.!?;]/.test(items[i].char) || i === items.length - 1) {
      const text = buf.trim();
      if (text) chunks.push({ text, start, end: i });
      buf = '';
      start = i + 1;
    }
  }
  if (!chunks.length && items.length) {
    chunks.push({ text: items.map(s => s.char).join(''), start: 0, end: items.length - 1 });
  }
  return chunks;
}

function highlightRangeProgress(start, end, rate, token){
  clearTimeout(highlightTimer);
  let i = start;
  const tick = () => {
    if (token !== speakToken || !reading || pausedReading) return;
    if (i > end) return;
    setActiveSeq(i);
    const ch = sequence[i] ? sequence[i].char : '';
    const base = isHanzi(ch) ? 280 : 120;
    i++;
    highlightTimer = setTimeout(tick, Math.max(60, base / rate));
  };
  tick();
}

function speakSentenceAt(pos, token){
  if (token !== speakToken || !reading) return;
  if (pos >= sentenceQueue.length) {
    stopReading();
    setReadStatus('朗读完成 ✓');
    return;
  }
  sentencePos = pos;
  const chunk = sentenceQueue[pos];
  const rate = parseFloat(rateRange.value) || 0.9;
  const utt = new SpeechSynthesisUtterance(chunk.text);
  utt.lang = 'zh-CN';
  utt.rate = rate;
  if (chineseVoice) utt.voice = chineseVoice;
  highlightRangeProgress(chunk.start, chunk.end, rate, token);
  utt.onboundary = (e) => {
    if (token !== speakToken || typeof e.charIndex !== 'number') return;
    clearTimeout(highlightTimer);
    setActiveSeq(Math.min(chunk.start + e.charIndex, chunk.end));
  };
  utt.onend = () => {
    if (token !== speakToken) return;
    clearTimeout(highlightTimer);
    setTimeout(() => speakSentenceAt(pos + 1, token), 180);
  };
  utt.onerror = (e) => {
    if (token !== speakToken) return;
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    stopReading();
    setReadStatus('朗读出错，请再试一次', true);
  };
  setTimeout(() => {
    if (token !== speakToken || !reading || pausedReading) return;
    speechSynthesis.speak(utt);
  }, 40);
}

function startReading(){
  if (!('speechSynthesis' in window)) {
    setReadStatus('浏览器不支持语音朗读', true);
    return;
  }
  if (!sequence.length) { setReadStatus('请先生成文章', true); return; }
  pickChineseVoice();
  stopReading(false);
  const token = ++speakToken;
  sentenceQueue = splitIntoSentences(sequence);
  reading = true;
  pausedReading = false;
  readBtn.textContent = '⏸ 暂停';
  setReadStatus('朗读中…');
  startSpeechKeepAlive();
  speechSynthesis.cancel();
  setTimeout(() => speakSentenceAt(0, token), 80);
}

function pauseReading(){
  if (!reading || pausedReading) return;
  pausedReading = true;
  clearTimeout(highlightTimer);
  stopSpeechKeepAlive();
  try { speechSynthesis.pause(); } catch (e) {}
  readBtn.textContent = '▶️ 继续';
  setReadStatus('已暂停');
}

function resumeReading(){
  if (!reading || !pausedReading) return;
  pausedReading = false;
  readBtn.textContent = '⏸ 暂停';
  setReadStatus('朗读中…');
  startSpeechKeepAlive();
  try {
    if (speechSynthesis.paused) speechSynthesis.resume();
    else if (!speechSynthesis.speaking) speakSentenceAt(sentencePos, speakToken);
  } catch (e) {
    speakSentenceAt(sentencePos, speakToken);
  }
}

rateLabel.textContent = rateRange.value + '×';
rateRange.addEventListener('input', () => { rateLabel.textContent = rateRange.value + '×'; });
readBtn.addEventListener('click', () => {
  if (!reading) startReading();
  else if (pausedReading) resumeReading();
  else pauseReading();
});
document.getElementById('stopReadBtn').addEventListener('click', () => {
  stopReading();
  setReadStatus('已停止');
});

// init with short kid-friendly text (wait a frame so writer area has real size)
document.getElementById('articleInput').value = PRESETS.short;
requestAnimationFrame(() => buildFromText(PRESETS.short));
</script>
