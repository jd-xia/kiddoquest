<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Elephant’s Child: P3 Story Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3EC; --surface:#FFFFFF; --ink:#243B2F; --ink2:#4E6A5B; --leaf:#1F4D3A;
  --orange:#E8833A; --sun:#F2C230; --blue:#2F6FA8; --green:#5E8C3A; --mark:#FCE3CF; --line:#CFE0D4;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13241B; --surface:#1C3327; --ink:#EAF3EC; --ink2:#B5CBBE; --leaf:#BFE3C9; --mark:#5A3A22; --line:#2E4A3A; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#13241B; --surface:#1C3327; --ink:#EAF3EC; --ink2:#B5CBBE; --leaf:#BFE3C9; --mark:#5A3A22; --line:#2E4A3A; color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:Andika, "Trebuchet MS", system-ui, sans-serif; font-size:1.15rem; line-height:1.55; min-height:100%;}
header{max-width:1120px; margin:0 auto; padding:14px 20px 6px; display:flex; align-items:center; gap:14px}
header h1{font-family:Fredoka, Arial, sans-serif; font-weight:600; font-size:1.15rem; margin:0; color:var(--leaf); flex:1}
.eta{font-size:.95rem; color:var(--ink2); white-space:nowrap}
#stars{font-family:Fredoka, Arial, sans-serif; font-weight:700; font-size:1.25rem; background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:4px 14px; color:var(--ink)}
#stars .s{color:var(--sun); -webkit-text-stroke:1px #C79A12}
#stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}
.icon{background:var(--surface); border:2px solid var(--line); border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer; color:var(--ink)}
.icon[aria-pressed="true"]{opacity:.5}
#book{max-width:1120px; margin:0 auto; padding:8px 20px; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:22px; align-items:start}
#stage{position:relative; aspect-ratio:1080/880; border-radius:28px; overflow:hidden; background:#CFE8E0; touch-action:manipulation}
.art,.art svg,#stage canvas{display:block; width:100%; height:100%}
#stage canvas{touch-action:none; cursor:grab}
#panel{background:var(--surface); border-radius:24px; padding:22px 24px; border:2px solid var(--line); min-height:100%}
#panel h2{font-family:Fredoka, Arial, sans-serif; font-weight:700; font-size:2rem; line-height:1.15; margin:0 0 12px; color:var(--leaf)}
.txt{max-width:46ch}
mark{background:var(--mark); color:inherit; border-radius:6px; padding:0 4px; font-weight:700}
.act{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px}
.btn{font-family:Fredoka, Arial, sans-serif; font-weight:600; font-size:1.1rem; border:0; border-radius:16px; padding:12px 18px; cursor:pointer; color:#fff; background:var(--green); box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .08s}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.c0{background:var(--green)} .btn.c1{background:var(--blue)} .btn.c2{background:var(--orange)}
.act .btn.c0,.act .btn.c1,.act .btn.c2{flex:1 1 100%; text-align:left}
.btn.big{font-size:1.4rem; padding:14px 28px; background:var(--orange)}
.btn.pull{background:var(--blue); font-size:2rem; flex:1 1 100%; padding:22px}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn:disabled{opacity:.45; cursor:default}
.btn.wrong{background:#B9473F !important; opacity:.6}
.btn.right{background:var(--green) !important; outline:4px solid var(--sun)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
.fb{font-weight:700; margin:6px 0 0; flex:1 1 100%}
.fb.ok{color:var(--green)} .fb.no{color:#B9473F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fb.ok{color:#9CD07A} }
input{font:inherit; padding:10px 14px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); flex:1 1 200px}
nav{max-width:1120px; margin:0 auto; padding:12px 20px 24px; display:flex; align-items:center; gap:12px}
nav .btn{background:var(--leaf); color:var(--surface)}
#next{margin-left:auto; background:var(--orange); color:#fff; font-size:1.25rem}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; flex:1}
#dots span{width:9px; height:9px; border-radius:50%; background:var(--line)}
#dots span.g{background:#F2C23080; border-radius:2px; transform:rotate(45deg)}
#dots span.on{background:var(--orange); transform:scale(1.4)}
.hud{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; font-family:Fredoka, Arial, sans-serif; font-weight:700; font-size:clamp(1rem,3vw,1.6rem); pointer-events:none; color:#1F4D3A}
.hud span{background:#ffffffd9; border-radius:999px; padding:4px 14px}
.hud span:empty{display:none}
.meter{position:absolute; left:6%; right:6%; bottom:5%; height:22px; border-radius:999px; background:#ffffffb3; overflow:hidden}
#bar{height:100%; width:50%; background:linear-gradient(90deg,#E8833A,#F2C230,#5E8C3A); transition:width .05s}
.clock{position:absolute; top:6%; right:6%; font-family:Fredoka, Arial, sans-serif; font-weight:700; font-size:clamp(2rem,7vw,4.5rem); color:#1F4D3A; background:#ffffffd9; padding:4px 22px; border-radius:24px}
.bubbles{position:absolute; inset:5% 5% auto 38%; display:flex; flex-direction:column; gap:10px}
.bub{font-family:Fredoka, Arial, sans-serif; font-weight:600; font-size:clamp(.9rem,2.4vw,1.3rem); padding:10px 16px; border-radius:20px; background:#fff; color:#243B2F; animation:pop .35s}
.bub.r{align-self:flex-start; background:#1F4D3A; color:#fff; font-size:clamp(1.1rem,3.4vw,1.9rem)}
.log{cursor:pointer} .log .reveal{opacity:0; transition:opacity .3s} .log .wood{transition:opacity .3s}
.log.open .reveal{opacity:1} .log.open .wood{opacity:0}
.log.nope{animation:wob .4s; opacity:.55}
@keyframes wob{25%{transform:translate(var(--x,0),0) rotate(-3deg)}75%{rotate:3deg}}
#flyzone{position:absolute; inset:0}
.fly{position:absolute; width:clamp(44px,9%,72px); aspect-ratio:1; padding:0; border:0; background:none; cursor:crosshair; animation:buzz .8s ease-in-out infinite alternate}
.fly svg{width:100%; height:100%}
.fly.hit{animation:none; transform:scale(.2) rotate(180deg); opacity:0; transition:.25s}
@keyframes buzz{0%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-10px) rotate(6deg)}100%{transform:translate(-10px,8px) rotate(-4deg)}}
.cert{position:absolute; left:5%; right:5%; bottom:5%; background:#fff; color:#243B2F; border-radius:22px; padding:14px 18px; display:flex; gap:14px; align-items:center; border:4px solid var(--sun); animation:pop .6s}
.cert .medal{flex-shrink:0; width:clamp(44px,9vw,70px); height:auto; font-size:clamp(2rem,6vw,3.4rem); color:var(--sun); -webkit-text-stroke:2px #C79A12; line-height:1}
.cert small{display:block; color:#4E6A5B} .cert strong{display:block; font-family:Fredoka, Arial, sans-serif; font-size:clamp(1.1rem,3vw,1.6rem); color:#1F4D3A}
.cert span{display:block; font-family:Fredoka, Arial, sans-serif; font-weight:600} .cert .cs{color:var(--sun); letter-spacing:2px; font-size:.9rem}

.gl{font:inherit; color:inherit; background:none; border:0; padding:0; border-bottom:3px dotted var(--orange); cursor:help}
.gloss{background:var(--mark); border-radius:14px; padding:10px 14px; margin:14px 0 0; max-width:46ch}
.small{font-size:.95rem; color:var(--ink2); margin:0 0 8px}
.clue{font-weight:700; margin:0 0 10px; flex:1 1 100%}
.builder{flex:1 1 100%; display:flex; flex-direction:column; gap:10px}
.line{min-height:58px; border:3px dashed var(--line); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.line.ok{border-color:var(--green); border-style:solid}
.pool{display:flex; flex-wrap:wrap; gap:8px}
.pool.col{flex-direction:column}
.btn.tile{background:var(--blue); padding:10px 14px; min-width:46px; font-size:1.15rem}
.line .btn.tile{background:var(--leaf); color:var(--surface)}
.sent{line-height:2.3; font-size:1.15rem}
.btn.word{background:var(--bg); color:var(--ink); border:2px solid var(--line); box-shadow:none; padding:4px 10px; font-family:inherit; font-weight:400; font-size:1.1rem}
.btn.word.sel{background:var(--sun); color:#243B2F; border-color:#C79A12; font-weight:700}
.slots{display:flex; gap:6px; flex-wrap:wrap}
.slots span{width:40px; height:48px; border-bottom:4px solid var(--line); font-family:Fredoka, Arial, sans-serif; font-weight:700; font-size:1.6rem; text-align:center; line-height:48px}
.slots span.f{border-color:var(--green); color:var(--green)}
.builder > .btn.ghost{align-self:flex-start}
.btn.row{background:var(--bg); color:var(--ink); border:2px solid var(--line); box-shadow:none; text-align:left; font-family:inherit; font-weight:400; font-size:1.02rem; padding:10px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%}
.seq{margin:0 0 8px; padding-left:1.6em; flex:1 1 100%} .seq li{color:var(--green); font-weight:700; margin:2px 0}
.act > .pool.col{flex:1 1 100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.res{flex:1 1 100%; background:var(--mark); border-radius:16px; padding:12px 16px; animation:pop .4s}
.res p{margin:4px 0 0}
.earn{font-size:1.9rem; color:var(--sun); -webkit-text-stroke:1px #C79A12; letter-spacing:3px}
.earn i{font-style:normal; color:transparent; -webkit-text-stroke:1px var(--ink2); opacity:.5}
.row .earn{font-size:1.1rem; letter-spacing:1px; white-space:nowrap}
.score{display:flex; flex-direction:column; gap:6px; flex:1 1 100%; max-height:46vh; overflow:auto}
#dots span.d{background:var(--sun)}
.drift1{animation:drift 3.2s ease-in-out infinite alternate} .drift2{animation:drift 2.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.fly{width:auto !important; min-width:60px; display:flex; flex-direction:column; align-items:center}
.fly svg{width:clamp(36px,7vw,58px); height:clamp(36px,7vw,58px)}
.fly b{font-family:Fredoka, Arial, sans-serif; font-size:clamp(.85rem,2.2vw,1.15rem); background:#fff; color:#243B2F; border-radius:10px; padding:1px 8px; margin-top:-6px}
.fly.bad b{background:#B9473F; color:#fff}
.mem{position:absolute; inset:0; padding:3%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr); gap:2.4%; background:#CFE8E0}
.card{position:relative; border:0; border-radius:16px; cursor:pointer; background:var(--leaf); color:#fff; font-family:Fredoka, Arial, sans-serif; font-weight:600; font-size:clamp(.75rem,2vw,1.15rem); padding:6px; box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card .back{font-size:clamp(1.6rem,5vw,2.8rem); color:var(--sun)} .card .face{display:none}
.card.up{background:#fff; color:#243B2F} .card.up.w{background:#FCE3CF}
.card.up .back{display:none} .card.up .face{display:block}
.card.got{outline:4px solid var(--green); opacity:.75}
@media (max-width:760px){
  #book{grid-template-columns:1fr; gap:14px; padding:6px 12px}
  #stage{border-radius:20px} #panel{padding:16px 18px} #panel h2{font-size:1.6rem}
  header{padding:10px 12px 4px} nav{padding:10px 12px 20px; flex-wrap:wrap} #dots{order:-1; flex:1 1 100%; margin-bottom:6px}
  #next{flex:1}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<header>
  <h1>The Elephant’s Child</h1>
  <span id="eta" class="eta"></span>
  <div id="stars" aria-live="polite"><span class="s">★</span> <span id="starN">0</span></div>
  <button id="mute" class="icon" aria-pressed="false" aria-label="Sound effects on or off" title="Sound">🔊</button>
</header>
<main id="book">
  <div id="stage"></div>
  <section id="panel" aria-live="polite"></section>
</main>
<nav>
  <button id="back" class="btn">◀ Back</button>
  <button id="read" class="btn">🗣 Read to me</button>
  <div id="dots" aria-hidden="true"></div>
  <button id="next" class="btn">Next page</button>
</nav>
<script>
// Simple cartoon SVG components for the Elephant's Child deck
const G = { sky: "#CFE8E0", grass: "#9CC17A", grass2: "#7FA85E", river: "#7E9A7A", river2: "#6C8868",
  ele: "#A3ADB5", eleD: "#86919A", ear: "#C9A3A8", croc: "#5E8C3A", crocD: "#47702A",
  snakeA: "#2F6FA8", snakeB: "#F2C230", tree: "#C9C25A", treeTrunk: "#B9B04A", sun: "#F6B94A", orange: "#E8833A" };

function elephant(x, y, s, opt = {}) {
  const trunk = opt.trunk || 0; // 0 = short boot nose, 1 = medium stretch, 2 = full trunk
  const flip = opt.flip ? -1 : 1;
  const eye = opt.surprised ? `<circle cx="62" cy="-38" r="7" fill="#fff"/><circle cx="63" cy="-38" r="4" fill="#222"/>`
                            : `<circle cx="62" cy="-38" r="5" fill="#222"/><circle cx="64" cy="-40" r="1.6" fill="#fff"/>`;
  let nose;
  if (trunk === 0) nose = `<ellipse cx="102" cy="-20" rx="22" ry="16" fill="${G.ele}"/>`;
  else if (trunk === 1) nose = `<path d="M90 -30 Q170 -36 250 -26 L250 -6 Q170 -10 90 -2 Z" fill="${G.ele}"/>`;
  else nose = `<path d="M88 -32 Q122 -20 120 30 Q118 80 140 96 L128 108 Q96 86 98 30 Q100 -6 82 -6 Z" fill="${G.ele}"/>
    <path d="M104 40 L116 42 M102 58 L114 58 M104 74 L116 72" stroke="${G.eleD}" stroke-width="3" fill="none"/>`;
  return `<g transform="translate(${x},${y}) scale(${s * flip},${s})">
    <rect x="-70" y="30" width="28" height="60" rx="10" fill="${G.eleD}"/>
    <rect x="20" y="30" width="28" height="60" rx="10" fill="${G.eleD}"/>
    <ellipse cx="-10" cy="10" rx="90" ry="62" fill="${G.ele}"/>
    <rect x="-50" y="36" width="28" height="58" rx="10" fill="${G.ele}"/>
    <rect x="40" y="36" width="28" height="58" rx="10" fill="${G.ele}"/>
    <path d="M-98 0 Q-118 20 -110 40" stroke="${G.eleD}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="-30" r="52" fill="${G.ele}"/>
    <ellipse cx="18" cy="-26" rx="30" ry="40" fill="${G.ear}" stroke="${G.ele}" stroke-width="8"/>
    ${nose}${eye}
    <path d="M70 -6 Q78 0 86 -4" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>`;
}

function crocodile(x, y, s, opt = {}) {
  const open = opt.open;
  const jaw = open
    ? `<path d="M120 -10 L300 -60 L300 -40 L130 6 Z" fill="${G.croc}"/>
       <path d="M140 -6 L160 -18 L170 -10 L190 -24 L200 -16 L220 -30 L230 -22 L250 -36 L260 -28 L280 -44" stroke="#fff" stroke-width="5" fill="none"/>`
    : `<path d="M120 -18 L300 -10 L300 6 L120 10 Z" fill="${G.croc}"/>
       <path d="M150 6 l6 8 l6 -8 M180 6 l6 8 l6 -8 M210 6 l6 8 l6 -8 M240 6 l6 8 l6 -8" stroke="#fff" stroke-width="3" fill="#fff"/>`;
  const eyeL = opt.wink ? `<path d="M96 -40 Q106 -32 116 -40" stroke="#222" stroke-width="4" fill="none"/>`
                        : `<circle cx="106" cy="-38" r="6" fill="#222"/>`;
  return `<g transform="translate(${x},${y}) scale(${opt.flip ? -s : s},${s})">
    <path d="M-300 10 Q-200 -8 -120 -6 L-120 18 Q-200 24 -300 10 Z" fill="${G.crocD}"/>
    <ellipse cx="0" cy="0" rx="140" ry="32" fill="${G.croc}"/>
    <path d="M-100 -26 l14 -14 l14 14 M-60 -30 l14 -14 l14 14 M-20 -32 l14 -14 l14 14 M20 -30 l14 -14 l14 14" fill="${G.crocD}"/>
    ${jaw}
    <circle cx="106" cy="-34" r="14" fill="${G.croc}"/>${eyeL}
    <rect x="-80" y="22" width="22" height="26" rx="8" fill="${G.crocD}"/>
    <rect x="50" y="22" width="22" height="26" rx="8" fill="${G.crocD}"/>
  </g>`;
}

function snake(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-160 60 C-100 0 -60 120 0 60 C60 0 100 120 160 40 C190 0 180 -60 150 -90" stroke="${G.snakeA}" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M-160 60 C-100 0 -60 120 0 60 C60 0 100 120 160 40 C190 0 180 -60 150 -90" stroke="${G.snakeB}" stroke-width="34" fill="none" stroke-dasharray="26 26" stroke-linecap="butt"/>
    <ellipse cx="146" cy="-100" rx="34" ry="24" fill="${G.snakeA}"/>
    <circle cx="156" cy="-108" r="5" fill="#222"/>
    <path d="M178 -96 l18 -2 m-18 2 l16 8" stroke="#D23A3A" stroke-width="3"/>
  </g>`;
}

function bird(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <ellipse cx="0" cy="0" rx="36" ry="28" fill="${G.orange}"/>
    <path d="M-30 -4 Q-70 -30 -60 10 Z" fill="#C9652A"/>
    <circle cx="26" cy="-22" r="20" fill="${G.orange}"/>
    <circle cx="32" cy="-26" r="4" fill="#222"/>
    <path d="M44 -24 L66 -18 L44 -12 Z" fill="#F2C230"/>
    <path d="M-6 26 L-10 44 M8 26 L6 44" stroke="#6B4A2A" stroke-width="4"/>
  </g>`;
}

function feverTree(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path d="M-8 0 L-4 -150 L4 -150 L8 0 Z" fill="${G.treeTrunk}"/>
    <path d="M0 -120 L-50 -170 M0 -130 L50 -180" stroke="${G.treeTrunk}" stroke-width="8"/>
    <ellipse cx="0" cy="-190" rx="110" ry="30" fill="${G.tree}" opacity="0.9"/>
    <ellipse cx="-30" cy="-215" rx="60" ry="22" fill="${G.tree}"/>
  </g>`;
}

function bush(x, y, s, c) {
  return `<g transform="translate(${x},${y}) scale(${s})"><circle cx="-30" cy="0" r="34" fill="${c || G.grass2}"/><circle cx="10" cy="-14" r="40" fill="${c || G.grass2}"/><circle cx="46" cy="4" r="30" fill="${c || G.grass2}"/></g>`;
}

function fruit(x, y) {
  return `<g transform="translate(${x},${y})">
    <ellipse cx="0" cy="0" rx="30" ry="24" fill="#6BAA3F"/><path d="M-20 -6 Q0 -16 20 -6" stroke="#4E8A2A" stroke-width="3" fill="none"/>
    <path d="M30 -10 Q60 -40 80 -10 Q60 -26 34 0 Z" fill="#F2D23A"/>
    <rect x="-60" y="-50" width="10" height="70" rx="4" fill="#B88A4A" transform="rotate(-20)"/>
  </g>`;
}

function frame(inner, bg) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880">
    <defs><clipPath id="c"><rect width="1080" height="880" rx="60"/></clipPath></defs>
    <g clip-path="url(#c)"><rect width="1080" height="880" fill="${bg || G.sky}"/>${inner}</g></svg>`;
}
const ground = (y, c) => `<path d="M0 ${y} Q270 ${y - 30} 540 ${y} T1080 ${y} V880 H0 Z" fill="${c || G.grass}"/>`;
const riverBand = (y) => `<path d="M0 ${y} Q270 ${y - 24} 540 ${y} T1080 ${y} V880 H0 Z" fill="${G.river}"/>
  <path d="M80 ${y + 60} q30 -10 60 0 M400 ${y + 110} q30 -10 60 0 M760 ${y + 70} q30 -10 60 0 M220 ${y + 170} q30 -10 60 0" stroke="${G.river2}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
const sun = (x, y) => `<circle cx="${x}" cy="${y}" r="60" fill="${G.sun}"/>`;
const qmark = (x, y, sz, c) => `<text x="${x}" y="${y}" font-family="Arial" font-weight="bold" font-size="${sz}" fill="${c || G.orange}">?</text>`;


// ===== scenes =====
const lvl = 640;
const SC = {
  title: () => frame(sun(900, 130) + feverTree(160, lvl, 1) + ground(lvl) + riverBand(760) + elephant(560, 520, 1.6) + qmark(760, 260, 140) + qmark(860, 340, 90, "#2F6FA8")),
  longago: () => frame(sun(160, 140) + ground(lvl) + bush(880, 650, 1.3) + bush(150, 690, 1) + elephant(560, 520, 1.7)),
  questions: () => frame(ground(lvl) + elephant(330, 470, 2.0) + elephant(790, 610, 0.9, { flip: true }) + qmark(700, 300, 110) + qmark(840, 220, 80, "#2F6FA8") + qmark(940, 320, 70) + bush(960, 760, 1)),

}

    g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);

    if (win) result(a, oops === 0 ? 3 : oops <= 2 ? 2 : 1, 3, `10 adjectives swatted with ${left}s left${oops ? ` (${oops} wrong swat${oops === 1 ? "" : "s"})` : ""}!`, () => GAMES.flies());
    else { boo(); a.insertAdjacentHTML("beforeend", `<p class="fb no">Time's up! You reached ${n}.</p>`); start.hidden = false; start.textContent = "Try again"; } }
  cleanup = () => { running = false; clearInterval(timer); clearInterval(spawnT); };
};

// ===== wiring =====
$("#back").onclick = () => go(st.i - 1);
$("#next").onclick = () => go(st.i + 1);
$("#read").onclick = () => { const p = PAGES[st.i]; const t = p.t === "game" || p.t === "quiz" ? panel.querySelector(".txt").textContent : p.text; if (t) speak(t); };
$("#mute").onclick = (e) => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); };
addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; const g = PAGES[st.i].t === "game";
  if (e.key === "PageDown" || (!g && e.key === "ArrowRight")) go(st.i + 1); if (e.key === "PageUp" || (!g && e.key === "ArrowLeft")) go(st.i - 1); });
if (!("speechSynthesis" in window)) $("#read").remove();
render();

</script>
