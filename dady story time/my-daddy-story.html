<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daddy Story Time: My Daddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --ink:#22304F; --ink2:#5A6785; --brand:#2B3A67; --accent:#E8833A; --pink:#C2347A; --line:#D5E0EF; --chip:#E6EEF9; --mark:#FCE3CF; --sun:#F2C230; --green:#5E8C3A; --blue:#2F6FA8;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141B2E; --surface:#1F2840; --ink:#EEF2FA; --ink2:#B6C0D8; --brand:#BFD0F5; --line:#33405F; --chip:#2A3552; --mark:#5A3A22; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#141B2E; --surface:#1F2840; --ink:#EEF2FA; --ink2:#B6C0D8; --brand:#BFD0F5; --line:#33405F; --chip:#2A3552; --mark:#5A3A22; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:Andika,"Trebuchet MS",system-ui,sans-serif; font-size:1.1rem; line-height:1.5}
header{max-width:1120px; margin:0 auto; padding:14px 20px 4px; display:flex; align-items:center; gap:12px}
.hgroup{flex:1} .series{font-family:Fredoka,Arial,sans-serif; font-weight:600; color:var(--ink2); font-size:.9rem}
h1{font-family:Fredoka,Arial,sans-serif; font-weight:700; color:var(--brand); font-size:clamp(1.3rem,3.4vw,1.8rem); margin:0; line-height:1.1}
#stars{font-family:Fredoka,Arial,sans-serif; font-weight:700; font-size:1.2rem; background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:4px 14px}
#stars .s{color:var(--sun); -webkit-text-stroke:1px #C79A12}
#stars.pop{animation:pop .5s} @keyframes pop{40%{transform:scale(1.3)}}
.icon{background:var(--surface); border:2px solid var(--line); border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer; color:var(--ink)}
.icon[aria-pressed="true"]{opacity:.45}
#book{max-width:1120px; margin:0 auto; padding:8px 20px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:22px; align-items:start}
#stage{position:relative; aspect-ratio:1080/880; border-radius:28px; overflow:hidden; background:#DCEBFA}
#stage.tall{aspect-ratio:600/760; background:linear-gradient(#FFE3EF,#FFD1E5); max-height:82vh; margin:0 auto; width:100%}
.art,.art svg,#dsvg{display:block; width:100%; height:100%}
#dsvg{cursor:pointer}
#panel{background:var(--surface); border:2px solid var(--line); border-radius:24px; padding:20px 22px}
#panel h2{font-family:Fredoka,Arial,sans-serif; font-weight:700; font-size:1.9rem; line-height:1.15; margin:0 0 10px; color:var(--brand)}
#panel h3{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:1.15rem; margin:20px 0 4px; color:var(--brand)}
.txt{max-width:48ch; margin:0}
mark{background:var(--mark); color:inherit; border-radius:6px; padding:0 4px; font-weight:700}
.act{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center}
.btn{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:1.08rem; border:0; border-radius:16px; padding:12px 18px; cursor:pointer; color:#fff; background:var(--green); box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.c0{background:var(--green)} .btn.c1{background:var(--blue)} .btn.c2{background:var(--accent)}
.act > .btn.c0,.act > .btn.c1,.act > .btn.c2{flex:1 1 100%; text-align:left}
.btn.big{background:var(--accent); font-size:1.2rem} .btn.alt{background:#7A5AC8} .btn.pink{background:var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn:disabled{opacity:.45; cursor:default}
.btn.wrong{background:#B9473F !important; opacity:.6}
.btn.right{outline:4px solid var(--sun); opacity:1 !important}
button:focus-visible,input:focus-visible,label:focus-within{outline:4px solid var(--sun); outline-offset:3px}
.pill{background:var(--accent); color:#fff; font-family:Fredoka,Arial,sans-serif; font-weight:600; border-radius:999px; padding:8px 16px}
.count{font-family:Fredoka,Arial,sans-serif; font-weight:700; color:var(--accent)}
.res{flex:1 1 100%; background:var(--mark); border-radius:16px; padding:12px 16px; animation:rise .35s}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}
.res p{margin:4px 0 0}
.earn{font-size:1.8rem; color:var(--sun); -webkit-text-stroke:1px #C79A12; letter-spacing:3px}
.earn i{font-style:normal; color:transparent; -webkit-text-stroke:1px var(--ink2); opacity:.5}
.row .earn{font-size:1.05rem; letter-spacing:1px; white-space:nowrap}
.btn.row{background:var(--bg); color:var(--ink); border:2px solid var(--line); box-shadow:none; font-family:inherit; font-weight:400; font-size:1rem; padding:9px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%}
.score{display:flex; flex-direction:column; gap:6px; flex:1 1 100%}
.traits{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; flex:1 1 100%}
.btn.trait{background:var(--chip); color:var(--ink); box-shadow:none; border:3px solid transparent; display:flex; flex-direction:column; align-items:center; gap:2px}
.btn.trait .e{font-size:1.8rem}
.btn.trait.right{border-color:var(--accent); outline:none; background:var(--surface)}
.small{font-size:.9rem; color:var(--ink2); margin:0}
nav{max-width:1120px; margin:0 auto; padding:12px 20px 24px; display:flex; align-items:center; gap:12px}
nav .btn{background:var(--brand); color:var(--surface)}
#next{margin-left:auto; background:var(--accent); color:#fff; font-size:1.2rem}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; flex:1}
#dots span{width:9px; height:9px; border-radius:50%; background:var(--line)}
#dots span.g{border-radius:2px; transform:rotate(45deg); background:#F2C23070} #dots span.d{background:var(--sun)}
#dots span.on{background:var(--accent); transform:scale(1.4)}
/* dress-up */
#bubble{position:absolute; top:4%; right:4%; max-width:58%; background:#fff; color:#2B2340; font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:clamp(.95rem,2.2vw,1.2rem); padding:10px 16px; border-radius:20px 20px 4px 20px; box-shadow:0 4px 0 #0001; opacity:0; transform:scale(.8); transition:.2s; pointer-events:none}
#bubble.on{opacity:1; transform:none}
.meter{position:absolute; left:5%; right:5%; bottom:4%; background:#ffffffcc; border-radius:999px; padding:6px 12px; display:flex; align-items:center; gap:10px; font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:.95rem; color:#2B2340}
.bar{flex:1; height:14px; background:#F4D3E2; border-radius:99px; overflow:hidden}
#fill{height:100%; width:0; background:linear-gradient(90deg,#F2C230,#F07AAE,#C2347A); transition:width .3s}
#flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
#flash.go{animation:flash .6s} @keyframes flash{0%{opacity:.95}100%{opacity:0}}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 10px}
.tab{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:.98rem; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:7px 13px; cursor:pointer}
.tab[aria-selected="true"]{background:var(--pink); border-color:var(--pink); color:#fff}
.hint{color:var(--ink2); margin:0 0 10px; font-size:.95rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px}
.item{border:3px solid transparent; background:var(--chip); color:var(--ink); border-radius:18px; padding:10px 6px; cursor:pointer; font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:.95rem; display:flex; flex-direction:column; align-items:center; gap:4px}
.item .e{font-size:1.9rem; line-height:1}
.item[aria-pressed="true"]{border-color:var(--pink); background:var(--surface)}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.actions #photo{background:var(--pink)}
#card{margin-top:16px; background:var(--mark); border-radius:18px; padding:14px 16px}
#card[hidden]{display:none}
#card h2{font-size:1.35rem !important; margin:0 0 4px !important}
#card .stars{font-size:1.5rem; color:var(--sun); letter-spacing:2px; -webkit-text-stroke:1px #C79A12}
#card .stars i{font-style:normal; color:transparent; -webkit-text-stroke:1px var(--ink2); opacity:.5}
#card mark{background:var(--surface); color:var(--pink)}
#card p{margin:6px 0}
.facebox{grid-column:1/-1; display:flex; flex-direction:column; gap:12px}
.facebox .btn.up{align-self:flex-start; display:inline-block; background:var(--pink); font-size:1.12rem; padding:13px 20px}
.sl{display:flex; align-items:center; gap:12px; font-family:Fredoka,Arial,sans-serif; font-weight:600}
.sl input{flex:1; accent-color:var(--pink); height:28px}
.facebox .btn.ghost{align-self:flex-start}
.who{display:flex; flex-wrap:wrap; gap:8px}
.whob{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:1rem; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:7px 14px; cursor:pointer}
.whob[aria-selected="true"]{background:var(--brand); color:var(--surface); border-color:var(--brand)}
.cert{position:absolute; left:6%; right:6%; bottom:4%; background:#fff; color:#22304F; border-radius:20px; padding:10px 16px; display:flex; gap:12px; align-items:center; border:4px solid var(--sun); animation:rise .6s}
.cert .medal{width:clamp(40px,8vw,60px); flex-shrink:0}
.cert small{display:block; color:#5A6785} .cert strong{display:block; font-family:Fredoka,Arial,sans-serif; font-size:clamp(1.2rem,3vw,1.7rem); color:#C2347A}
@media (max-width:760px){
  #book{grid-template-columns:1fr; gap:14px; padding:6px 12px} #panel{padding:16px} #panel h2{font-size:1.55rem}
  header{padding:10px 12px 2px} nav{padding:10px 12px 20px; flex-wrap:wrap} #dots{order:-1; flex:1 1 100%; margin-bottom:6px} #next{flex:1}
  #stage.tall{max-height:none; aspect-ratio:600/700} .grid{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<header>
  <div class="hgroup"><div class="series">Daddy Story Time</div><h1>My Daddy</h1></div>
  <div id="stars" aria-live="polite"><span class="s">★</span> <span id="starN">0</span></div>
  <button id="mute" class="icon" aria-pressed="false" aria-label="Sound on or off">🔊</button>
</header>
<main id="book">
  <div id="stage"></div>
  <section id="panel" aria-live="polite"></section>
</main>
<nav>
  <button id="back" class="btn">◀ Back</button>
  <button id="read" class="btn">🗣 Read to me</button>
  <div id="dots" aria-hidden="true"></div>
  <button id="next" class="btn">Next</button>
</nav>
<script>
// Cartoon people + props for the "My Daddy" deck

function person(x, y, s, o = {}) {
  const rx = (o.kid ? 72 : 118) * (o.belly || 1), shirt = o.shirt || "#2F6FA8", pants = o.pants || "#2B3A67";
  const by = o.kid ? -215 : -255, bry = (o.kid ? 95 : 128) * (o.belly ? 1.08 : 1), hy = o.kid ? -365 : -445, hr = o.kid ? 62 : 68;
  const sh = o.kid ? -280 : -330; // shoulder y
  const arm = (x1, y1, x2, y2, x3, y3) => `<path d="M${x1} ${y1} L${x2} ${y2}${x3 !== undefined ? ` L${x3} ${y3}` : ""}" stroke="${shirt}" stroke-width="${o.kid ? 26 : 36}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x3 ?? x2}" cy="${y3 ?? y2}" r="${o.kid ? 15 : 20}" fill="${SKIN}"/>`;
  const ax = rx * 0.8;
  let arms = "";
  const pose = o.arms || "down";
  const L = pose === "up" || pose === "flex" ? (pose === "flex" ? arm(-ax, sh, -ax - 80, sh - 10, -ax - 80, sh - 120) : arm(-ax, sh, -ax - 50, sh - 170))
    : pose === "hug" ? arm(-ax, sh, -ax + 20, sh + 110) : arm(-ax, sh, -ax - 40, sh + 140);
  const R = pose === "up" || pose === "flex" ? (pose === "flex" ? arm(ax, sh, ax + 80, sh - 10, ax + 80, sh - 120) : arm(ax, sh, ax + 50, sh - 170))
    : pose === "wave" ? arm(ax, sh, ax + 70, sh - 140) : pose === "give" ? arm(ax, sh, ax + 110, sh + 40) : pose === "hug" ? arm(ax, sh, ax - 20, sh + 110) : arm(ax, sh, ax + 40, sh + 140);
  arms = L + R;
  const muscles = pose === "flex" ? `<circle cx="${-ax - 70}" cy="${sh - 40}" r="26" fill="${shirt}"/><circle cx="${ax + 70}" cy="${sh - 40}" r="26" fill="${shirt}"/>` : "";
  const face = o.tongue
    ? `<path d="M-26 ${hy + 18} Q0 ${hy + 44} 26 ${hy + 18} Z" fill="#7A2E2E"/><ellipse cx="0" cy="${hy + 36}" rx="11" ry="12" fill="#E86A7A"/>`
    : o.laugh ? `<path d="M-28 ${hy + 14} Q0 ${hy + 54} 28 ${hy + 14} Z" fill="#7A2E2E"/>`
    : `<path d="M-24 ${hy + 18} Q0 ${hy + 38} 24 ${hy + 18}" stroke="#7A2E2E" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const eyes = o.wink
    ? `<circle cx="-24" cy="${hy - 8}" r="7" fill="#222"/><path d="M14 ${hy - 8} Q24 ${hy - 16} 34 ${hy - 8}" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : o.silly ? `<circle cx="-24" cy="${hy - 8}" r="11" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="-20" cy="${hy - 4}" r="5" fill="#222"/><circle cx="24" cy="${hy - 8}" r="11" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="20" cy="${hy - 12}" r="5" fill="#222"/>`
    : `<circle cx="-24" cy="${hy - 8}" r="7" fill="#222"/><circle cx="24" cy="${hy - 8}" r="7" fill="#222"/><circle cx="-21" cy="${hy - 11}" r="2" fill="#fff"/><circle cx="27" cy="${hy - 11}" r="2" fill="#fff"/>`;
  const hair = o.kid
    ? `<path d="M${-hr} ${hy - 6} Q${-hr} ${hy - hr - 18} 0 ${hy - hr - 10} Q${hr} ${hy - hr - 18} ${hr} ${hy - 6} Q${hr * 0.5} ${hy - hr * 0.55} ${-hr * 0.2} ${hy - hr * 0.6} Q${-hr * 0.7} ${hy - hr * 0.4} ${-hr} ${hy - 6} Z" fill="${HAIR}"/>`
    : `<path d="M${-hr - 2} ${hy - 4} Q${-hr - 4} ${hy - hr - 20} 0 ${hy - hr - 14} Q${hr + 6} ${hy - hr - 16} ${hr + 2} ${hy - 10} Q${hr * 0.4} ${hy - hr * 0.7} ${-hr * 0.4} ${hy - hr * 0.62} Q${-hr * 0.8} ${hy - hr * 0.5} ${-hr - 2} ${hy - 4} Z" fill="${HAIR}"/>`;
  const glasses = o.shades ? `<rect x="-48" y="${hy - 22}" width="40" height="26" rx="8" fill="#222"/><rect x="8" y="${hy - 22}" width="40" height="26" rx="8" fill="#222"/><path d="M-8 ${hy - 12} L8 ${hy - 12}" stroke="#222" stroke-width="5"/>` : "";
  const bow = o.bow ? `<path d="M0 ${by - bry + 14} l-34 -18 l0 36 Z M0 ${by - bry + 14} l34 -18 l0 36 Z" fill="#D23A3A"/><circle cx="0" cy="${by - bry + 14}" r="9" fill="#B02A2A"/>` : "";
  const buttons = o.kid ? "" : `<circle cx="0" cy="${by - 40}" r="6" fill="#ffffff90"/><circle cx="0" cy="${by + 10}" r="6" fill="#ffffff90"/><circle cx="0" cy="${by + 60}" r="6" fill="#ffffff90"/>`;
  return `<g transform="translate(${x},${y}) scale(${s})">
    <rect x="${o.kid ? -36 : -52}" y="${o.kid ? -130 : -160}" width="${o.kid ? 28 : 38}" height="${o.kid ? 124 : 154}" rx="12" fill="${pants}"/>
    <rect x="${o.kid ? 8 : 14}" y="${o.kid ? -130 : -160}" width="${o.kid ? 28 : 38}" height="${o.kid ? 124 : 154}" rx="12" fill="${pants}"/>
    <ellipse cx="${o.kid ? -24 : -34}" cy="0" rx="${o.kid ? 24 : 32}" ry="12" fill="#333"/><ellipse cx="${o.kid ? 24 : 34}" cy="0" rx="${o.kid ? 24 : 32}" ry="12" fill="#333"/>
    ${o.hug ? "" : arms}
    <ellipse cx="0" cy="${by}" rx="${rx}" ry="${bry}" fill="${shirt}"/>${buttons}${muscles}${o.girl ? `<path d="M-58 ${by + bry - 34} L-86 -104 Q0 -90 86 -104 L58 ${by + bry - 34} Z" fill="${o.skirt || "#C2347A"}"/>` : ""}
    ${o.hug ? arms : ""}
    ${o.girl ? `<circle cx="${-hr - 16}" cy="${hy - 6}" r="28" fill="${HAIR}"/><circle cx="${hr + 16}" cy="${hy - 6}" r="28" fill="${HAIR}"/><circle cx="${-hr - 4}" cy="${hy - 30}" r="10" fill="#F07AAE"/><circle cx="${hr + 4}" cy="${hy - 30}" r="10" fill="#F07AAE"/>` : ""}
    ${FACES[o.who || "daddy"].src ? photoHead(hy, hr, o.drag, o.who || "daddy", s) : `<circle cx="${-hr}" cy="${hy}" r="13" fill="${SKIND}"/><circle cx="${hr}" cy="${hy}" r="13" fill="${SKIND}"/>
    <circle cx="0" cy="${hy}" r="${hr}" fill="${SKIN}"/>${hair}${eyes}${glasses}
    <circle cx="-36" cy="${hy + 12}" r="9" fill="#E88A8A" opacity=".5"/><circle cx="36" cy="${hy + 12}" r="9" fill="#E88A8A" opacity=".5"/>
    ${face}`}${bow}
  </g>`;
}

const heart = (x, y, s, c) => `<path transform="translate(${x},${y}) scale(${s})" d="M0 12 C-30 -10 -24 -36 0 -22 C24 -36 30 -10 0 12 Z" fill="${c || "#E8566A"}"/>`;
const sparkle = (x, y, s, c) => `<path transform="translate(${x},${y}) scale(${s})" d="M0 -30 L7 -7 L30 0 L7 7 L0 30 L-7 7 L-30 0 L-7 -7 Z" fill="${c || "#F2C230"}"/>`;
const dumbbell = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-120" y="-8" width="240" height="16" rx="6" fill="#7A7F87"/><rect x="-150" y="-40" width="34" height="80" rx="8" fill="#333"/><rect x="116" y="-40" width="34" height="80" rx="8" fill="#333"/></g>`;
const bags = (x, y) => [0, 1, 2, 3, 4].map((k) => `<g transform="translate(${x + k * 70},${y - (k % 2) * 10})"><path d="M-28 -60 h56 l6 60 h-68 Z" fill="${["#E8833A", "#5E8C3A", "#2F6FA8", "#F2C230", "#C9652A"][k]}"/><path d="M-14 -60 q14 -26 28 0" stroke="#555" stroke-width="5" fill="none"/></g>`).join("");
const clock = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><circle cx="-46" cy="-62" r="20" fill="#D23A3A"/><circle cx="46" cy="-62" r="20" fill="#D23A3A"/><circle r="70" fill="#fff" stroke="#D23A3A" stroke-width="14"/><path d="M0 0 L0 -46 M0 0 L0 46" stroke="#222" stroke-width="8" stroke-linecap="round"/><circle r="8" fill="#222"/><text y="-80" x="80" font-family="Arial" font-weight="bold" font-size="40" fill="#D23A3A">RING!</text></g>`;
const checklist = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-90" y="-120" width="180" height="240" rx="16" fill="#fff" stroke="#2B3A67" stroke-width="8"/>${[0, 1, 2].map((k) => `<path d="M-60 ${-60 + k * 60} l14 14 l26 -28" stroke="#5E8C3A" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="-6" y="${-62 + k * 60}" width="70" height="12" rx="6" fill="#B8C2D9"/>`).join("")}</g>`;
const broccoli = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-10" y="0" width="20" height="60" rx="8" fill="#8DBE5A"/><circle cx="-22" cy="-6" r="24" fill="#3E7E2E"/><circle cx="22" cy="-6" r="24" fill="#3E7E2E"/><circle cx="0" cy="-26" r="26" fill="#4E8E3A"/></g>`;
const house = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-120" y="-160" width="240" height="160" fill="#F7E0B8"/><path d="M-150 -150 L0 -270 L150 -150 Z" fill="#C9652A"/><rect x="-30" y="-90" width="60" height="90" fill="#8A5A3A"/><rect x="-100" y="-130" width="50" height="44" fill="#BFE3F2"/><rect x="50" y="-130" width="50" height="44" fill="#BFE3F2"/></g>`;
const bike = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})" fill="none" stroke="#D23A3A" stroke-width="8"><circle cx="-70" cy="0" r="44" stroke="#333"/><circle cx="70" cy="0" r="44" stroke="#333"/><path d="M-70 0 L-10 -60 L50 -60 L70 0 M-10 -60 L0 0 L-70 0 M50 -60 L44 -84"/></g>`;
const plaster = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s}) rotate(-20)"><rect x="-40" y="-14" width="80" height="28" rx="12" fill="#F2C9A0"/><rect x="-14" y="-14" width="28" height="28" fill="#E8B98F"/></g>`;
const jelly = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="10" rx="80" ry="16" fill="#fff"/><path d="M-60 0 Q-64 -80 -40 -90 L40 -90 Q64 -80 60 0 Z" fill="#E8566A" opacity=".85"/><path d="M-30 -80 q10 30 0 60" stroke="#fff" stroke-width="8" fill="none" opacity=".6"/></g>`;

  TRAITS.forEach(([t, e]) => grid.append(btn(`<span class="e">${e}</span>${t}`, "trait" + (st.pick === t ? " right" : ""), (ev) => {
    st.pick = t; saveSt(); award(1); yay(); grid.querySelectorAll("button").forEach((b) => b.classList.remove("right")); ev.currentTarget.classList.add("right");
    say(`Aww, you think I'm ${t.toLowerCase()}?`);
    const r = a.querySelector(".res") || a.appendChild(Object.assign(document.createElement("div"), { className: "res" }));
    r.innerHTML = `<p>Say it out loud: \u201CMy daddy is <b>${t.toLowerCase()}</b> because \u2026\u201D</p><p class="small">Next: it\u2019s time for Daddy\u2019s fashion show!</p>`;
  })));
  a.append(grid);
}

// ----- dress up -----
function renderDress() {
  stage.className = "tall";
  stage.innerHTML = `<svg id="dsvg" viewBox="0 0 600 760" role="img" aria-label="Daddy wearing the outfit you chose"></svg><div id="bubble" aria-live="polite"></div>
    <div class="meter" aria-label="Silliness meter"><span>Silly-o-meter</span><div class="bar"><div id="fill"></div></div><span id="pct">0%</span></div><div id="flash"></div>`;
  panel.innerHTML = `<h2>Daddy\u2019s Fashion Show</h2><p class="txt">Daddy was so brave in the story. Now it\u2019s your turn to dress him up! Tap clothes to put them on. Tap again to take them off.</p>
    <div class="tabs" role="tablist" id="tabs"></div><p class="hint" id="hint"></p><div class="grid" id="grid"></div>
    <div class="actions"><button class="btn alt" id="rand">\uD83C\uDFB2 Surprise me</button><button class="btn" id="photo">\uD83D\uDCF8 Photo time!</button><button class="btn ghost" id="reset">\u21BA Take it all off</button></div>
    <div id="card" hidden aria-live="polite"></div>`;
  if (cat === "face" && !CATS.some((c) => c.id === "face")) cat = "hair";
  renderTabs(); renderGrid(); draw();
  $("#dsvg").onclick = () => { if (suppressClick) { suppressClick = false; return; } say(TAP[Math.floor(Math.random() * TAP.length)]); beep(700 + Math.random() * 300, 0.08); };
  $("#rand").onclick = () => { on.clear();
    CATS.filter((c) => !c.custom).forEach((c) => { const list = ITEMS.filter((i) => i.cat === c.id);
      if (c.multi) list.forEach((i) => Math.random() < 0.5 && on.add(i.id)); else on.add(list[Math.floor(Math.random() * list.length)].id); });
    [523, 659, 784, 1046].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70)); say("Ta-da! A brand-new Daddy!"); $("#card").hidden = true; draw(); renderGrid(); saveOutfit(); };
  $("#reset").onclick = () => { on.clear(); say("Back to boring old Daddy!"); $("#card").hidden = true; draw(); renderGrid(); saveOutfit(); beep(250, 0.2, "triangle"); };
  $("#photo").onclick = photoTime;
  setTimeout(() => say(on.size ? "Welcome back, fashion designer!" : "Uh oh\u2026 what are you going to put on me?"), 300);
}
function renderTabs() {
  $("#tabs").innerHTML = "";
  CATS.forEach((c) => { const t = document.createElement("button"); t.className = "tab"; t.setAttribute("role", "tab"); t.textContent = c.label; t.setAttribute("aria-selected", c.id === cat);
    t.onclick = () => { cat = c.id; renderTabs(); renderGrid(); beep(500, 0.05); }; $("#tabs").append(t); });
}
function renderGrid() {
  const c = CATS.find((x) => x.id === cat);
  if (c.custom) return renderFace();
  $("#hint").textContent = c.hint + " Tap again to take it off."; $("#grid").innerHTML = "";
  ITEMS.filter((i) => i.cat === cat).forEach((it) => { const b = document.createElement("button"); b.className = "item"; b.setAttribute("aria-pressed", has(it.id));
    b.innerHTML = `<span class="e" aria-hidden="true">${it.e}</span>${it.name}`; b.onclick = () => toggle(it); $("#grid").append(b); });
}
function toggle(it) {
  const c = CATS.find((x) => x.id === it.cat);
  if (has(it.id)) { on.delete(it.id); beep(300, 0.1, "triangle"); say("Phew!"); }
  else { if (!c.multi) ITEMS.filter((i) => i.cat === it.cat).forEach((i) => on.delete(i.id)); on.add(it.id); ding(); say(LINES[it.id]); }
  $("#card").hidden = true; draw(); renderGrid(); saveOutfit();
}
function outfitSentence() { const worn = ITEMS.filter((i) => on.has(i.id)).map((i) => i.adj); return worn.length === 1 ? worn[0] : worn.slice(0, -1).join(", ") + " and " + worn[worn.length - 1]; }
function photoTime() {
  const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  beep(1200, 0.05, "square", 0.08); setTimeout(() => beep(900, 0.08, "square", 0.06), 60);
  const card = $("#card"); card.hidden = false;
  if (!on.size) { card.innerHTML = `<h2>Hmm\u2026</h2><p>Daddy is just wearing his normal clothes! Dress him up first.</p>`; return; }
  const score = Math.min(10, on.size + (has("heels") ? 1 : 0) + (has("curls") ? 1 : 0));
  const judge = score >= 9 ? "The judges are rolling on the floor laughing!" : score >= 6 ? "Absolutely fabulous, darling!" : score >= 3 ? "Very stylish! Add more for extra giggles." : "A good start! Keep going!";
  const s5 = Math.max(1, Math.round(score / 2)); award(score >= 6 ? 3 : score >= 3 ? 2 : 1);
  card.innerHTML = `<h2>\uD83D\uDCF8 Daddy\u2019s New Look</h2><div class="stars" aria-label="${s5} out of 5">${"\u2605".repeat(s5)}<i>${"\u2605".repeat(5 - s5)}</i></div>
    <p>Daddy is wearing <mark>${outfitSentence()}</mark>.</p><p><b>Silliness score: ${score}/10.</b> ${judge}</p>
    <p class="small">Your turn: describe Daddy\u2019s outfit out loud using adjectives, like the sentence above!</p>`;
  say(score >= 6 ? "I'm a superstar!" : "Cheese!");
}

// ----- face upload (cover and dress page) -----
function loadPhoto(file, who) {
  const F = FACES[who], r = new FileReader();
  r.onload = () => { const img = new Image();
    img.onload = () => { const S = 420, c = document.createElement("canvas"); c.width = c.height = S; const k = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, S, S);
      Object.assign(F, { src: c.toDataURL("image/jpeg", 0.85), z: 1, x: 0, y: 0 }); saveFace(who); refresh(); renderFace(); ding();
      say(who === "daddy" ? "Is that ME?! Ha ha ha!" : `Hello, ${NAMES[who]}!`); };
    img.onerror = () => say("Hmm, I couldn't open that picture."); img.src = r.result; };
  r.readAsDataURL(file);
}
let faceWho = "daddy";
function renderFace() {
  const g = $("#grid"); if (!g) return;
  const F = FACES[faceWho], nm = NAMES[faceWho];
  $("#hint").textContent = F.src ? "Use the sliders, or drag the face on the picture, so it fits nicely." : `Upload a photo of ${nm}\u2019s face and it will appear in every picture. A big smile works best! (Optional.)`;
  g.innerHTML = ""; const box = document.createElement("div"); box.className = "facebox";
  box.innerHTML = `<div class="who" role="tablist">${Object.keys(FACES).map((w) => `<button class="whob" data-w="${w}" role="tab" aria-selected="${w === faceWho}">${FACES[w].src ? "\u2705" : "\uD83D\uDC64"} ${NAMES[w]}</button>`).join("")}</div>
    <label class="btn up">\uD83D\uDCF7 ${F.src ? "Change" : "Upload"} ${nm}\u2019s photo<input type="file" accept="image/*" id="file" hidden></label>` +
    (F.src ? `<label class="sl">Zoom <input type="range" id="fz" min="0.6" max="2.5" step="0.05" value="${F.z}"></label>
    <label class="sl">Left / right <input type="range" id="fx" min="-90" max="90" step="1" value="${F.x}"></label>
    <label class="sl">Up / down <input type="range" id="fy" min="-90" max="90" step="1" value="${F.y}"></label>
    <button class="btn ghost" id="frm">Use cartoon face</button>` : "") +
    `<p class="small">\uD83D\uDD12 Photos stay on this device. They aren\u2019t sent anywhere.</p>`;
  g.append(box);
  box.querySelectorAll(".whob").forEach((b) => (b.onclick = () => { faceWho = b.dataset.w; renderFace(); beep(500, 0.05); }));
  $("#file").onchange = (e) => { const f = e.target.files[0]; if (f) loadPhoto(f, faceWho); };
  if (F.src) { [["fz", "z"], ["fx", "x"], ["fy", "y"]].forEach(([id, k]) => ($("#" + id).oninput = (e) => { F[k] = +e.target.value; refresh(); }));
    box.querySelectorAll("input[type=range]").forEach((i) => (i.onchange = () => saveFace(faceWho)));
    $("#frm").onclick = () => { F.src = null; saveFace(faceWho); refresh(); renderFace(); say("Cartoon face is back!"); }; }
}
let drag = null;
stage.addEventListener("pointerdown", (e) => { const im = e.target.closest("image[data-who]"); if (!im) return; e.preventDefault();
  const w = im.dataset.who, F = FACES[w]; drag = { w, s: +im.dataset.s || 1, x: e.clientX, y: e.clientY, fx: F.x, fy: F.y, moved: false };
  if (faceWho !== w) { faceWho = w; renderFace(); } });
addEventListener("pointermove", (e) => { if (!drag) return; const svg = stage.querySelector("svg"); const r = svg.getBoundingClientRect();
  const k = svg.viewBox.baseVal.width / r.width / drag.s, F = FACES[drag.w];
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  F.x = Math.max(-90, Math.min(90, drag.fx + dx)); F.y = Math.max(-90, Math.min(90, drag.fy + dy)); refresh(); });
addEventListener("pointerup", () => { if (drag && drag.moved) { suppressClick = true; saveFace(drag.w); renderFace(); } drag = null; });

// ----- end -----
function renderEnd() {
  stage.className = "tall";
  stage.innerHTML = `<svg id="dsvg" viewBox="0 0 600 760" role="img" aria-label="Daddy in his fashion show outfit"></svg><div class="cert"><svg class="medal" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0 -10 L2.9 -3.1 L9.5 -3.1 L4.2 1.2 L6.2 8 L0 4 L-6.2 8 L-4.2 1.2 L-9.5 -3.1 L-2.9 -3.1 Z" fill="#F2C230" stroke="#C79A12" stroke-width="1"/></svg><div><small>Daddy is</small><strong>${st.pick ? esc(st.pick) : "the Best"}!</strong></div></div>`;
  draw();
  const pct = st.stars / MAXSTARS;
  const a = setPanel("I Love My Daddy!", `Strong, caring, funny, hardworking and a little bit fat \uD83D\uDE02. I am truly lucky to have such a wonderful daddy!<br><br>You earned <b>${st.stars} of ${MAXSTARS} stars</b>. ${pct >= 0.8 ? "You're a <b>Daddy Expert</b>!" : "Go back and replay any game for more stars."}${on.size ? `<br><br>At the fashion show, Daddy wore <mark>${outfitSentence()}</mark>.` : ""}`);
  const list = document.createElement("div"); list.className = "score";
  PAGES.forEach((q, k) => { if (q.max) list.append(btn(`<span>${q.title}</span>${starsTxt(st.done["p" + k] || 0, q.max)}`, "row", () => go(k))); });
  a.append(list, btn("\uD83E\uDD17 Now give Daddy a big hug!", "big", () => yay()), btn("Read it again", "ghost", () => go(0)));
  if (pct >= 0.5) yay();
}

// ===== wiring =====
$("#back").onclick = () => go(st.i - 1);
$("#next").onclick = () => go(st.i + 1);
$("#read").onclick = () => { const t = panel.querySelector(".txt"); if (t) speak(t.textContent); };
$("#mute").onclick = (e) => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); };
addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; if (e.key === "PageDown") go(st.i + 1); if (e.key === "PageUp") go(st.i - 1); });
if (!("speechSynthesis" in window)) $("#read").remove();
render();

</script>
</body>
</html>
