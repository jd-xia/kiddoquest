<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daddy Story Time: Harbin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="../js/cloud-config.js"></script>
<script src="../js/cloud-save.js"></script>
<style>
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --ink:#22304F; --ink2:#5A6785; --brand:#2B3A67; --accent:#E8833A; --pink:#C2347A; --line:#D5E0EF; --chip:#E6EEF9; --mark:#FCE3CF; --sun:#F2C230; --green:#5E8C3A; --blue:#2F6FA8;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141B2E; --surface:#1F2840; --ink:#EEF2FA; --ink2:#B6C0D8; --brand:#BFD0F5; --line:#33405F; --chip:#2A3552; --mark:#5A3A22; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#141B2E; --surface:#1F2840; --ink:#EEF2FA; --ink2:#B6C0D8; --brand:#BFD0F5; --line:#33405F; --chip:#2A3552; --mark:#5A3A22; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:Andika,"Trebuchet MS",system-ui,sans-serif; font-size:1.1rem; line-height:1.5}
header{max-width:1120px; margin:0 auto; padding:14px 20px 4px; display:flex; align-items:center; gap:12px}
.hgroup{flex:1} .series{font-family:Fredoka,Arial,sans-serif; font-weight:600; color:var(--ink2); font-size:.9rem}
h1{font-family:Fredoka,Arial,sans-serif; font-weight:700; color:var(--brand); font-size:clamp(1.3rem,3.4vw,1.8rem); margin:0; line-height:1.1}
.chip{font-family:Fredoka,Arial,sans-serif; font-weight:700; background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:4px 14px; white-space:nowrap}
#stars{font-size:1.2rem}
#stars .s{color:var(--sun); -webkit-text-stroke:1px #C79A12}
#stars.pop{animation:pop .5s} @keyframes pop{40%{transform:scale(1.3)}}
#clock{font-size:.95rem; color:var(--ink2)}
.icon{background:var(--surface); border:2px solid var(--line); border-radius:50%; width:44px; height:44px; font-size:1.1rem; cursor:pointer; color:var(--ink)}
.icon[aria-pressed="true"]{opacity:.45}
#book{max-width:1120px; margin:0 auto; padding:8px 20px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:22px; align-items:start}
#stage{position:relative; aspect-ratio:1080/880; border-radius:28px; overflow:hidden; background:#DCEBFA; user-select:none}
#stage.ski{touch-action:none; cursor:pointer}
.art,.art svg{display:block; width:100%; height:100%}
.fall{animation:fall 16s linear infinite} @keyframes fall{to{transform:translateY(880px)}}
.slot{cursor:pointer; animation:pulse 1.2s ease-in-out infinite} .slot.wait{animation:none; opacity:.3}
@keyframes pulse{50%{opacity:.35}}
#panel{background:var(--surface); border:2px solid var(--line); border-radius:24px; padding:20px 22px}
#panel h2{font-family:Fredoka,Arial,sans-serif; font-weight:700; font-size:1.9rem; line-height:1.15; margin:0 0 10px; color:var(--brand)}
#panel h3{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:1.15rem; margin:20px 0 4px; color:var(--brand)}
.cn{font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-weight:400; color:var(--ink2); font-size:.62em; white-space:nowrap}
.txt{max-width:48ch; margin:0}
.ask{margin:12px 0 0; color:var(--ink2); font-size:.98rem}
mark{background:var(--mark); color:inherit; border-radius:6px; padding:0 4px; font-weight:700}
.act{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center}
.btn{font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:1.08rem; border:0; border-radius:16px; padding:12px 18px; cursor:pointer; color:#fff; background:var(--green); box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.c0{background:var(--green)} .btn.c1{background:var(--blue)} .btn.c2{background:var(--accent)}
.act > .btn.c0,.act > .btn.c1,.act > .btn.c2{flex:1 1 100%; text-align:left}
.btn.big{background:var(--accent); font-size:1.2rem} .btn.alt{background:#7A5AC8} .btn.pink{background:var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line); box-shadow:none}
.btn:disabled{opacity:.45; cursor:default}
.btn.wrong{background:#B9473F !important; opacity:.6}
.btn.right{outline:4px solid var(--sun); opacity:1 !important}
.btn.hold{flex:1 1 40%; font-size:1.6rem; background:var(--blue); touch-action:none; user-select:none}
button:focus-visible,input:focus-visible,label:focus-within{outline:4px solid var(--sun); outline-offset:3px}
.pill{background:var(--accent); color:#fff; font-family:Fredoka,Arial,sans-serif; font-weight:600; border-radius:999px; padding:8px 16px}
.count{font-family:Fredoka,Arial,sans-serif; font-weight:700; color:var(--accent)}
.res{flex:1 1 100%; background:var(--mark); border-radius:16px; padding:12px 16px; animation:rise .35s}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}
.res p{margin:4px 0 0}
.earn{font-size:1.8rem; color:var(--sun); -webkit-text-stroke:1px #C79A12; letter-spacing:3px}
.earn i{font-style:normal; color:transparent; -webkit-text-stroke:1px var(--ink2); opacity:.5}
.row .earn{font-size:1.05rem; letter-spacing:1px; white-space:nowrap}
.btn.row{background:var(--bg); color:var(--ink); border:2px solid var(--line); box-shadow:none; font-family:inherit; font-weight:400; font-size:1rem; padding:9px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; width:100%}
.score,.trip{display:flex; flex-direction:column; gap:6px; flex:1 1 100%}
.trip label{display:flex; gap:10px; align-items:center; background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:8px 12px; cursor:pointer; font-size:1rem}
.trip label:has(input:checked){background:var(--mark); border-color:var(--accent)}
.trip input{width:22px; height:22px; accent-color:var(--accent); flex-shrink:0}
.small{font-size:.9rem; color:var(--ink2); margin:0}
.date{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; font-family:Fredoka,Arial,sans-serif; font-weight:600}
.date input{font:inherit; font-weight:400; padding:6px 10px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink)}
#sleeps{color:var(--accent)}
nav{max-width:1120px; margin:0 auto; padding:12px 20px 24px; display:flex; align-items:center; gap:12px}
nav .btn{background:var(--brand); color:var(--surface)}
#next{margin-left:auto; background:var(--accent); color:#fff; font-size:1.2rem}
#dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; flex:1}
#dots span{width:9px; height:9px; border-radius:50%; background:var(--line)}
#dots span.g{border-radius:2px; transform:rotate(45deg); background:#F2C23070} #dots span.d{background:var(--sun)}
#dots span.on{background:var(--accent); transform:scale(1.4)}
#bubble{position:absolute; top:4%; right:4%; max-width:58%; background:#fff; color:#2B2340; font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:clamp(.95rem,2.2vw,1.2rem); padding:10px 16px; border-radius:20px 20px 4px 20px; box-shadow:0 4px 0 #0001; opacity:0; transform:scale(.8); transition:.2s; pointer-events:none}
#bubble.on{opacity:1; transform:none}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; flex:1 1 100%}
.item{border:3px solid transparent; background:var(--chip); color:var(--ink); border-radius:18px; padding:10px 6px; cursor:pointer; font-family:Fredoka,Arial,sans-serif; font-weight:600; font-size:.95rem; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center}
.item .e{font-size:1.9rem; line-height:1}
.item[aria-pressed="true"]{border-color:var(--green); background:var(--surface)}
.item.wrong{border-color:#B9473F; opacity:.5; cursor:default}
.item:disabled{cursor:default}
.cert{position:absolute; left:6%; right:6%; bottom:4%; background:#fff; color:#22304F; border-radius:20px; padding:10px 16px; display:flex; gap:12px; align-items:center; border:4px solid var(--sun); animation:rise .6s}
.cert .medal{width:clamp(40px,8vw,60px); flex-shrink:0}
.cert small{display:block; color:#5A6785} .cert strong{display:block; font-family:Fredoka,Arial,sans-serif; font-size:clamp(1.2rem,3vw,1.7rem); color:#C2347A}
@media (max-width:760px){
  #book{grid-template-columns:1fr; gap:14px; padding:6px 12px} #panel{padding:16px} #panel h2{font-size:1.55rem}
  header{padding:10px 12px 2px; flex-wrap:wrap} #clock{order:5} nav{padding:10px 12px 20px; flex-wrap:wrap} #dots{order:-1; flex:1 1 100%; margin-bottom:6px} #next{flex:1}
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<header>
  <div class="hgroup"><div class="series">Daddy Story Time</div><h1>Our Snowy Harbin Adventure</h1></div>
  <div id="clock" class="chip" aria-live="polite"></div>
  <div id="stars" class="chip" aria-live="polite"><span class="s">★</span> <span id="starN">0</span></div>
  <button id="mute" class="icon" aria-pressed="false" aria-label="Sound on or off">🔊</button>
</header>
<main id="book">
  <div id="stage"></div>
  <section id="panel" aria-live="polite"></section>
</main>
<nav>
  <button id="back" class="btn">◀ Back</button>
  <button id="read" class="btn">🗣 Read to me</button>
  <div id="dots" aria-hidden="true"></div>
  <button id="next" class="btn">Next</button>
</nav>
<script>
// Cartoon scenes for the Harbin trip story: Harbin city, Ice and Snow World, Yabuli, Snow Town

const $ = (q) => document.querySelector(q);
const R = (seed) => () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

// ===== art helpers =====
function frame(inner, bg) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" role="img"><defs><clipPath id="c"><rect width="1080" height="880" rx="60"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1638"/><stop offset="1" stop-color="#3A4784"/></linearGradient>
<linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC8EE"/><stop offset="1" stop-color="#E6F2FB"/></linearGradient></defs>
<g clip-path="url(#c)"><rect width="1080" height="880" fill="${bg || "url(#day)"}"/>${inner}</g></svg>`;
}
const txt = (x, y, t, sz, c, more = "") => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka, Arial" font-weight="700" font-size="${sz}" fill="${c}" ${more}>${t}</text>`;
const emo = (x, y, e, sz) => `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${sz}">${e}</text>`;
function flakes(n, seed) { const r = R(seed); let s = ""; for (let i = 0; i < n; i++) s += `<circle cx="${(r() * 1080) | 0}" cy="${(r() * 880) | 0}" r="${(3 + r() * 6).toFixed(1)}" fill="#fff" opacity="${(0.5 + r() * 0.5).toFixed(2)}"/>`; return s; }
const snowfall = (n = 50, seed = 7) => { const f = flakes(n, seed); return `<g class="fall"><g transform="translate(0,-880)">${f}</g><g>${f}</g></g>`; };
function skyStars(seed) { const r = R(seed); let s = ""; for (let i = 0; i < 40; i++) s += `<circle cx="${(r() * 1080) | 0}" cy="${(r() * 420) | 0}" r="${(1.5 + r() * 2.5).toFixed(1)}" fill="#FFF8D6" opacity="${(0.4 + r() * 0.6).toFixed(2)}"/>`; return s; }
const moon = (x, y) => `<circle cx="${x}" cy="${y}" r="90" fill="#FFF4C8" opacity=".35" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="52" fill="#FFF4C8"/><circle cx="${x + 16}" cy="${y - 10}" r="9" fill="#EADFA8"/><circle cx="${x - 14}" cy="${y + 16}" r="6" fill="#EADFA8"/>`;
const sunDisc = (x, y) => `<circle cx="${x}" cy="${y}" r="60" fill="#FFE7A0"/>`;
const snowGround = (y) => `<path d="M0 ${y} Q270 ${y - 40} 540 ${y} T1080 ${y} V880 H0 Z" fill="#F7FBFF"/><path d="M60 ${y + 60} Q300 ${y + 30} 600 ${y + 70} T1040 ${y + 60}" stroke="#DCE8F5" stroke-width="10" fill="none" stroke-linecap="round"/>`;
const pine = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-14" y="-40" width="28" height="40" fill="#6B4A2E"/><path d="M0 -270 L70 -160 H40 L100 -40 H-100 L-40 -160 H-70 Z" fill="#2F6B4F"/><path d="M0 -270 L32 -220 Q0 -205 -32 -220 Z M-58 -160 Q0 -140 58 -160 L42 -176 Q0 -162 -42 -176 Z M-100 -40 Q0 -20 100 -40 L80 -64 Q0 -46 -80 -64 Z" fill="#fff"/></g>`;
const tag = (x, y, name, c, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="${-name.length * 13 - 18}" y="-26" width="${name.length * 26 + 36}" height="46" rx="23" fill="#fff" stroke="${c}" stroke-width="5"/><text y="9" text-anchor="middle" font-family="Fredoka, Arial" font-weight="700" font-size="28" fill="${c}">${name}</text></g>`;
const badge = (x, y, t) => `<g transform="translate(${x},${y})"><rect x="-120" y="-46" width="240" height="92" rx="46" fill="#fff" stroke="#2F6FA8" stroke-width="6"/>${txt(0, 18, t, 50, "#2F6FA8")}</g>`;

// A person bundled up in winter clothes; feet at (x, y), about 470 units tall at s = 1
function bundle(x, y, s, o = {}) {
  const c = o.coat, m = o.hat;
  const arm = (d) => { const a = o.arms || "down"; let ex = d * 104, ey = -150;
    if (a === "up" || (a === "wave" && d === 1)) { ex = d * 140; ey = -430; }
    else if (a === "out") { ex = d * 175; ey = -250; }
    return `<path d="M${d * 70} -280 L${ex} ${ey}" stroke="${c}" stroke-width="46" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="25" fill="${m}"/>`; };
  const eyes = o.sleep ? `<path d="M-34 -358 q12 10 24 0 M10 -358 q12 10 24 0" stroke="#2B2340" stroke-width="6" fill="none" stroke-linecap="round"/>`
    : `<circle cx="-22" cy="-358" r="8" fill="#2B2340"/><circle cx="22" cy="-358" r="8" fill="#2B2340"/><circle cx="-19" cy="-361" r="2.5" fill="#fff"/><circle cx="25" cy="-361" r="2.5" fill="#fff"/>`;
  const mouth = o.laugh ? `<path d="M-22 -334 Q0 -306 22 -334 Z" fill="#8A2E3A"/>` : o.oh ? `<ellipse cx="0" cy="-328" rx="10" ry="12" fill="#8A2E3A"/>`
    : `<path d="M-18 -334 Q0 -320 18 -334" stroke="#8A2E3A" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const brows = o.dad ? `<path d="M-38 -378 h28 M10 -378 h28" stroke="${o.frost ? "#fff" : "#3A2A20"}" stroke-width="9" stroke-linecap="round"/>`
    : o.frost ? `<path d="M-34 -376 h22 M12 -376 h22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>` : "";
  const hair = o.mom ? `<path d="M-74 -390 Q-84 -290 -64 -262 L64 -262 Q84 -290 74 -390 Z" fill="#3A2A20"/>` : o.girl ? `<circle cx="-66" cy="-330" r="20" fill="#3A2A20"/><circle cx="66" cy="-330" r="20" fill="#3A2A20"/>` : "";
  const hat = o.nohat ? `<path d="M-62 -372 Q-62 -430 0 -430 Q62 -430 62 -372 Q30 -400 0 -398 Q-30 -400 -62 -372 Z" fill="#3A2A20"/>`
    : `<path d="M-66 -384 Q-66 -454 0 -456 Q66 -454 66 -384 Z" fill="${m}"/><rect x="-70" y="-404" width="140" height="26" rx="13" fill="#fff"/><circle cy="-462" r="21" fill="#fff"/>`;
  const breath = o.breath ? `<g fill="#fff" opacity=".9"><circle cx="72" cy="-330" r="16"/><circle cx="106" cy="-344" r="22"/><circle cx="148" cy="-358" r="28"/></g>` : "";
  const skis = o.ski ? `<rect x="-62" y="-30" width="26" height="110" rx="12" fill="#D23A3A"/><rect x="36" y="-30" width="26" height="110" rx="12" fill="#D23A3A"/>` : "";
  return `<g transform="translate(${x},${y}) scale(${s})">${skis}
<rect x="-58" y="-130" width="50" height="110" rx="16" fill="#3A3F55"/><rect x="8" y="-130" width="50" height="110" rx="16" fill="#3A3F55"/>
<rect x="-74" y="-34" width="70" height="36" rx="16" fill="#6B4A2E"/><rect x="4" y="-34" width="70" height="36" rx="16" fill="#6B4A2E"/>
${arm(-1)}${arm(1)}<rect x="-92" y="-318" width="184" height="215" rx="72" fill="${c}"/>
<path d="M-88 -245 H88 M-90 -175 H90" stroke="#fff" stroke-opacity=".22" stroke-width="7"/><path d="M0 -296 V-108" stroke="#000" stroke-opacity=".15" stroke-width="5"/>
${hair}<circle cy="-366" r="62" fill="#F5C9A8"/><circle cx="-38" cy="-336" r="11" fill="#F29A9A" opacity=".6"/><circle cx="38" cy="-336" r="11" fill="#F29A9A" opacity=".6"/>
${eyes}${brows}${mouth}${hat}<rect x="-64" y="-308" width="128" height="30" rx="15" fill="${o.scarf}"/><rect x="22" y="-292" width="28" height="74" rx="11" fill="${o.scarf}"/>${breath}</g>`;
}
const daddy = (x, y, s, o = {}) => bundle(x, y, s, Object.assign({ coat: "#2B3A67", hat: "#E8833A", scarf: "#F2C230", dad: true }, o));
const michelle = (x, y, s, o = {}) => bundle(x, y, s, Object.assign({ coat: "#B48CE8", hat: "#C2347A", scarf: "#F07AAE", girl: true }, o));
const mom = (x, y, s, o = {}) => bundle(x, y, s, Object.assign({ coat: "#2F8F8A", hat: "#F2C230", scarf: "#C2347A", mom: true }, o));
const jayden = (x, y, s, o = {}) => bundle(x, y, s, Object.assign({ coat: "#E8833A", hat: "#2F6FA8", scarf: "#5E8C3A" }, o));

// ----- props -----
function bldg(x, w, h, col, base) {
  let s = `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${col}"/><rect x="${x - 6}" y="${base - h - 12}" width="${w + 12}" height="20" rx="10" fill="#fff"/>`;
  for (let wy = base - h + 34; wy < base - 50; wy += 70) for (let wx = x + 22; wx < x + w - 30; wx += 58) s += `<path d="M${wx} ${wy + 44} V${wy + 14} Q${wx + 15} ${wy - 2} ${wx + 30} ${wy + 14} V${wy + 44} Z" fill="#FFF6D8" stroke="#0002" stroke-width="3"/>`;
  return s;
}
const onion = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-55 0 Q-78 -55 -22 -92 Q0 -108 0 -136 Q0 -108 22 -92 Q78 -55 55 0 Z" fill="#3E8E5A"/><path d="M-40 -40 Q-30 -70 -10 -86" stroke="#7FC79A" stroke-width="7" fill="none"/><path d="M0 -136 V-180 M-15 -164 H15" stroke="#E0B23A" stroke-width="7"/></g>`;
const sophia = (x, y, s) => `<g transform="translate(${x},${y}) scale(${s})">
<rect x="-175" y="-180" width="70" height="180" fill="#A44A35"/><rect x="105" y="-180" width="70" height="180" fill="#A44A35"/>${onion(-140, -180, 0.62)}${onion(140, -180, 0.62)}
<rect x="-120" y="-270" width="240" height="270" fill="#B5533C"/><rect x="-60" y="-390" width="120" height="125" fill="#B5533C"/>${onion(0, -390, 1.3)}
<path d="M-130 -270 H130 M-68 -390 H68" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
<path d="M-34 0 V-86 Q0 -128 34 -86 V0 Z" fill="#5A2A20"/><path d="M-90 -150 V-200 Q-70 -226 -50 -200 V-150 Z M50 -150 V-200 Q70 -226 90 -200 V-150 Z M-20 -300 V-350 Q0 -372 20 -350 V-300 Z" fill="#FFE6B0"/></g>`;
const cone = (x, y) => `<g transform="translate(${x},${y})"><path d="M-24 0 L0 64 L24 0 Z" fill="#E0A458"/><path d="M-14 12 L10 40 M14 12 L-8 44" stroke="#B9783A" stroke-width="3"/><circle cy="-14" r="28" fill="#FFF3D6"/><circle cx="-10" cy="-32" r="13" fill="#FFF3D6"/></g>`;
const tanghulu = (x, y) => `<g transform="translate(${x},${y})"><path d="M0 0 V-180" stroke="#C79A12" stroke-width="6"/>${[0, 1, 2, 3, 4].map((i) => `<circle cy="${-36 - i * 30}" r="17" fill="#E23A2E"/><circle cx="-6" cy="${-42 - i * 30}" r="5" fill="#fff" opacity=".7"/>`).join("")}</g>`;
const pear = (x, y) => `<g transform="translate(${x},${y})"><path d="M0 -40 Q16 -40 16 -18 Q34 0 26 22 Q14 40 0 40 Q-14 40 -26 22 Q-34 0 -16 -18 Q-16 -40 0 -40Z" fill="#3A2A22"/><path d="M0 -40 l5 -16" stroke="#6B4A2E" stroke-width="5"/></g>`;

const PAL = { rainbow: ["#7FD3FF", "#FF9AD5", "#B79CFF", "#8CF0B5", "#FFE07A"], pink: ["#FF9AD5", "#FFC2E6", "#FF7FC4"], blue: ["#7FD3FF", "#A9E4FF", "#5BB8F5"], green: ["#8CF0B5", "#B8F7D0", "#5FD99A"] };
function castle(x, y, s, o = {}) {
  const pal = PAL[o.lit], filled = o.filled || Array(12).fill(true), col = (k) => (pal ? pal[k % pal.length] : "#CFEFFF");
  let g = "";
  filled.forEach((f, k) => { const r = Math.floor(k / 4), c = k % 4, bx = -300 + c * 150, by = -100 * (r + 1);
    if (f) g += `<rect x="${bx + 3}" y="${by + 3}" width="144" height="94" rx="8" fill="${col(r + c)}" fill-opacity="${pal ? 0.95 : 0.85}" stroke="#fff" stroke-width="4"/><path d="M${bx + 20} ${by + 22} h34" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".75"/>`;
    else if (o.slots) g += `<rect class="slot${k < 4 || filled[k - 4] ? "" : " wait"}" data-k="${k}" x="${bx + 6}" y="${by + 6}" width="138" height="88" rx="10" fill="#ffffff33" stroke="#fff" stroke-width="5" stroke-dasharray="16 10"/>`; });
  if (filled.every(Boolean)) {
    const tower = (tx, k) => `<rect x="${tx + 3}" y="-417" width="144" height="114" rx="6" fill="${col(k)}" stroke="#fff" stroke-width="4"/><path d="M${tx - 10} -416 L${tx + 75} -540 L${tx + 160} -416 Z" fill="${col(k + 2)}" stroke="#fff" stroke-width="4"/><path d="M${tx + 75} -540 V-592" stroke="#fff" stroke-width="5"/><path d="M${tx + 75} -592 l42 14 l-42 14Z" fill="#E8566A"/>`;
    g += tower(-300, 1) + tower(150, 3) + [-150, -90, -30, 30, 90].map((cx, k) => `<rect x="${cx + 5}" y="-340" width="40" height="42" rx="5" fill="${col(k)}" stroke="#fff" stroke-width="3"/>`).join("");
  }
  const glow = pal ? `<ellipse cx="0" cy="-200" rx="440" ry="300" fill="${pal[0]}" opacity=".45" filter="url(#glow)"/>` : "";
  return `<g transform="translate(${x},${y}) scale(${s})">${glow}${g}</g>`;
}

    big.textContent = "Finish!"; a.innerHTML = "";
    a.insertAdjacentHTML("beforeend", `<div class="res">${starsTxt(s, 3)}<p>You caught <b>${flags} flags</b>! ${s === 3 ? "You’re a Yabuli ski champion!" : "Catch 12 flags for 3 stars."}</p></div>`);
    a.append(btn("⛷️ Ski again", "", start)); };
  a.append(btn("⛷️ Start!", "big", start));
  const key = (e) => { if (!running) return; if (e.key === "ArrowLeft") dir = e.type === "keydown" ? -1 : dir === -1 ? 0 : dir; if (e.key === "ArrowRight") dir = e.type === "keydown" ? 1 : dir === 1 ? 0 : dir; if (e.key.startsWith("Arrow")) e.preventDefault(); };
  const down = (e) => { if (!running) return; const r = stage.getBoundingClientRect(); dir = e.clientX < r.left + r.width / 2 ? -1 : 1; };
  const up = () => { dir = 0; };
  stage.addEventListener("pointerdown", down); addEventListener("pointerup", up); addEventListener("keydown", key); addEventListener("keyup", key);
  draw();
  cleanup = () => { running = false; cancelAnimationFrame(raf); stage.removeEventListener("pointerdown", down); removeEventListener("pointerup", up); removeEventListener("keydown", key); removeEventListener("keyup", key); };
}

// ----- game: snowman -----
function renderSnowman(p) {
  show(snowmanArt(st.snow));
  const a = setPanel(p.title, "In Snow Town we can build the biggest snowman ever! Tap things to dress him up. Tap again to take them off.");
  const grid = document.createElement("div"); grid.className = "grid";
  const sync = () => { grid.querySelectorAll(".item").forEach((b) => b.setAttribute("aria-pressed", st.snow.includes(b.dataset.id))); art(snowmanArt(st.snow)); };
  SNOWMAN.forEach(([id, e, n, g]) => { const b = btn(`<span class="e">${e}</span>${n}`, "item", () => {
      if (st.snow.includes(id)) st.snow = st.snow.filter((x) => x !== id);
      else { if (g) st.snow = st.snow.filter((x) => !SNOWMAN.some((s) => s[0] === x && s[3] === g)); st.snow.push(id); ding(); }
      saveSt(); sync(); const c = st.snow.length; if (c >= 6) award(2); else if (c >= 3) award(1);
      if (c === 6) { yay(); say(`${NAMES[st.name]} looks amazing!`); } });
    b.dataset.id = id; grid.append(b); });
  a.append(grid, btn("🏷️ Give him a name", "pink", () => { st.name = (st.name + 1) % NAMES.length; saveSt(); yay(); say(`Hello, I’m ${NAMES[st.name]}!`); }));
  a.insertAdjacentHTML("beforeend", `<p class="small">Use 3 things for ★, 6 things for ★★.</p>`);
  sync();
}

// ----- end -----
function renderEnd() {
  const fav = FAV.find((f) => f[1] === st.fav);
  show(SC.cover());
  stage.insertAdjacentHTML("beforeend", `<div class="cert"><svg class="medal" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0 -10 L2.9 -3.1 L9.5 -3.1 L4.2 1.2 L6.2 8 L0 4 L-6.2 8 L-4.2 1.2 L-9.5 -3.1 L-2.9 -3.1 Z" fill="#F2C230" stroke="#C79A12" stroke-width="1"/></svg><div><small>${st.stars} of ${MAXSTARS} stars · Daddy Story Time</small><strong>Little Harbin Explorer ${fav ? fav[0] : "❄️"}</strong></div></div>`);
  const pct = st.stars / MAXSTARS;
  const a = setPanel("Goodnight, little explorers!", `You earned <b>${st.stars} of ${MAXSTARS} stars</b>. ${pct >= 0.8 ? "You’re a <b>Harbin Expert</b>!" : "Go back and replay any game for more stars."}<br><br><b>Which place are you most excited about?</b>`);
  const favs = document.createElement("div"); favs.className = "score";
  FAV.forEach(([e, n]) => favs.append(btn(`<span>${e} ${n}</span>${st.fav === n ? "💖" : ""}`, "row", () => { st.fav = n; saveSt(); award(1); yay(); renderEnd(); say(`Me too! I can’t wait!`); })));
  a.append(favs);
  a.insertAdjacentHTML("beforeend", `<h3>✅ Our real Harbin checklist</h3><p class="small">Bring this on the trip and tick things off together!</p>`);
  const trip = document.createElement("div"); trip.className = "trip";
  TRIP.forEach((t, k) => { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" ${st.trip[k] ? "checked" : ""}> ${t}`;
    l.querySelector("input").onchange = (e) => { st.trip[k] = e.target.checked; saveSt(); if (e.target.checked) ding(); }; trip.append(l); });
  a.append(trip);
  a.insertAdjacentHTML("beforeend", `<h3>⭐ Your stars</h3>`);
  const list = document.createElement("div"); list.className = "score";
  PAGES.forEach((q, k) => { if (q.max && q.t !== "end") list.append(btn(`<span>${stripTags(q.title)}</span>${starsTxt(st.done["p" + k] || 0, q.max)}`, "row", () => go(k))); });
  a.append(list, btn("Read it again", "ghost", () => go(0)));
}

// ===== wiring =====
$("#back").onclick = () => go(st.i - 1);
$("#next").onclick = () => go(st.i + 1);
$("#read").onclick = () => { const t = panel.querySelector(".txt"); if (t) speak(t.textContent); };
$("#mute").onclick = (e) => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); };
addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; if (e.key === "PageDown") go(st.i + 1); if (e.key === "PageUp") go(st.i - 1); });
if (!("speechSynthesis" in window)) $("#read").remove();
render();
</script>
</body>
