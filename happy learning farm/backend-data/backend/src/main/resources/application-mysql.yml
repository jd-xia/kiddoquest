# Optional. The main settings already use MySQL.
# Set FARM_DB_URL, FARM_DB_USERNAME, and FARM_DB_PASSWORD to point at another server.
spring:
  datasource:
    url: ${FARM_DB_URL}
    username: ${FARM_DB_USERNAME}
    password: ${FARM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
