# Activate with --spring.profiles.active=mysql
spring:
  datasource:
    url: ${FARM_DB_URL}
    username: ${FARM_DB_USERNAME}
    password: ${FARM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
