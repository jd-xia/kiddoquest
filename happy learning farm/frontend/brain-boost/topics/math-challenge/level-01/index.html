<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Clock · Brain Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../kit/level-kit.css?v=2">
<style>.clock{font-size:22px;font-weight:700;min-width:70px;text-align:right}.clock.low{color:var(--bad)}</style>
</head>
<body>
<!-- Math Challenge · Level 1: as many quick sums as you can before the clock runs out.
     rules: questions (10), seconds (90), pass (6 right to clear). 3 stars for all right, 2 for 8 or more. -->
<main class="lv" id="lv"><p>Loading…</p></main>
<script src="../../../kit/level-kit.js?v=1"></script>
<script>
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
/* P1: add and take away within 20. P3: within 1000, and times tables. */
function sum(grade){
  if(grade==='p1'){if(Math.random()<.5){const a=rnd(1,10),b=rnd(1,10);return {text:`${a} + ${b}`,answer:a+b}}const a=rnd(5,20),b=rnd(1,a);return {text:`${a} − ${b}`,answer:a-b}}
  const k=rnd(0,2);
  if(k===0){const a=rnd(100,600),b=rnd(10,399);return {text:`${a} + ${b}`,answer:a+b}}
  if(k===1){const a=rnd(200,999),b=rnd(10,a-1);return {text:`${a} − ${b}`,answer:a-b}}
  const a=rnd(2,9),b=rnd(2,12);return {text:`${a} × ${b}`,answer:a*b};
}
let S=null,timer=null;
function left(){return Math.max(0,S.secs-Math.floor((Date.now()-S.start)/1000))}
function draw(){
  const q=S.qs[S.i],t=left();
  document.getElementById('lv').innerHTML=`
  <div class="lv-top"><button class="lv-x" id="quit" aria-label="Leave level">✕</button><div class="lv-name">Beat the Clock</div>
   <div class="lv-prog" aria-label="Question ${S.i+1} of ${S.qs.length}">${S.qs.map((x,k)=>`<i class="${x.ok?'ok':k===S.i?'on':''}"></i>`).join('')}</div>
   <div class="clock ${t<=15?'low':''}" id="clock" role="timer" aria-label="${t} seconds left">⏱ ${t}</div></div>
  <div class="lv-coach ${S.mood||''}"><span class="face" aria-hidden="true">🦊</span><div>${S.say||'Type the answer and tap OK. Be quick!'}</div></div>
  <div class="lv-q">${q.text} = ?</div>
  <div class="lv-show" id="show" aria-live="polite">${S.typed||'&nbsp;'}</div>
  <div class="lv-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="back" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button></div>`;
  document.getElementById('quit').onclick=()=>{clearInterval(timer);BBLevel.quit({answered:S.answered,correct:S.correct,total:S.qs.length})};
  document.querySelectorAll('.lv-pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function key(k){
  if(!S||S.over)return;
  if(k==='back'){S.typed=S.typed.slice(0,-1)}
  else if(k==='ok'){if(S.typed)check();return}
  else if(S.typed.length<5)S.typed+=k;
  document.getElementById('show').textContent=S.typed||' ';
}
function check(){
  const q=S.qs[S.i],v=Number(S.typed);S.answered++;S.typed='';
  if(v===q.answer){q.ok=true;S.correct++;S.mood='good';S.say=`Yes, ${q.answer}!`}
  else{S.mood='bad';S.say=`${q.text} = ${q.answer}. Keep going!`}
  if(S.i<S.qs.length-1){S.i++;draw()}else end();
}
function end(){
  if(S.over)return;S.over=true;clearInterval(timer);
  const pass=Math.min(S.qs.length,S.pass),ok=S.correct>=pass;
  const stars=!ok?0:S.correct===S.qs.length?3:S.correct>=Math.ceil(S.qs.length*.8)?2:1;
  BBLevel.finish({cleared:ok,stars,correct:S.correct,total:S.qs.length,answered:S.answered});
  document.getElementById('lv').innerHTML=`<div class="lv-done"><h2>${ok?'Speedy!':left()?'Nearly!':'Time is up!'}</h2>
   ${ok?`<div class="lv-stars" aria-label="${stars} stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}
   <p>${S.correct} of ${S.qs.length} right. ${ok?'':`${pass} right clears the level.`}</p>${BBLevel.alone?'<p>Open this level from Brain Boost to save it.</p>':'<p>Saving…</p>'}</div>`;
}
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('back');else if(e.key==='Enter')key('ok')});
BBLevel.ready(info=>{
  const r=(info.level&&info.level.rules)||{},grade=(info.child&&info.child.grade)||'p3',n=Math.max(3,Math.min(30,r.questions||10));
  S={qs:Array.from({length:n},()=>sum(grade)),i:0,correct:0,answered:0,typed:'',secs:Math.max(20,Math.min(600,r.seconds||90)),pass:r.pass||Math.ceil(n*.6),start:Date.now(),over:false};
  draw();
  timer=setInterval(()=>{const t=left(),c=document.getElementById('clock');if(c){c.textContent='⏱ '+t;c.classList.toggle('low',t<=15);c.setAttribute('aria-label',t+' seconds left')}if(!t)end()},500);
});
</script>
</body>
</html>
