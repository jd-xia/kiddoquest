# Optional. The main settings already use MySQL.
# Set OPENID_DB_URL, OPENID_DB_USERNAME, and OPENID_DB_PASSWORD to point at another server.
spring:
  datasource:
    url: ${OPENID_DB_URL}
    username: ${OPENID_DB_USERNAME}
    password: ${OPENID_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
