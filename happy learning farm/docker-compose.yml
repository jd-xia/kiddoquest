# Public address is http://localhost:8000 for the game, OpenID, and the farm API.
# OpenID and the farm API stay on the Docker network (8080 and 8081).
# From this directory: docker compose up --build
# Override secrets by copying .env.example to .env.

services:
  openid:
    build:
      context: ./backend-openID/backend
    image: happy-learning-farm-openid
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-PT12H}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - openid-data:/app/data
    restart: unless-stopped

  farm:
    build:
      context: ./backend-data/backend
    image: happy-learning-farm-farm
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
    volumes:
      - farm-data:/app/data
    depends_on:
      openid:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openid
      - farm
    restart: unless-stopped

volumes:
  openid-data:
  farm-data:
