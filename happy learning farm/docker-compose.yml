# Public address is http://localhost:8000 for the game, OpenID, and the farm API.
# OpenID and the farm API stay on the Docker network (8080 and 8081).
# Account and farm rows live in MySQL. docker compose down keeps that data.
# docker compose down -v deletes the MySQL volume.
# From this directory: docker compose up --build
# Override secrets by copying .env.example to .env.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  openid:
    build:
      context: ./backend-openID/backend
    image: happy-learning-farm-openid
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-PT12H}
      # Public OAuth client id, same value as frontend/common/cloud-config.js. Not a secret.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-669511875089-psnjdrjcfl3v8pc7kktm11bu8a3aau7p.apps.googleusercontent.com}
      OPENID_DB_URL: jdbc:mysql://mysql:3306/kiddoquest_openid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      OPENID_DB_USERNAME: root
      OPENID_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  farm:
    build:
      context: ./backend-data/backend
    image: happy-learning-farm-farm
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
      FARM_DB_URL: jdbc:mysql://mysql:3306/kiddoquest_farm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      FARM_DB_USERNAME: root
      FARM_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    depends_on:
      mysql:
        condition: service_healthy
      openid:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - openid
      - farm
    restart: unless-stopped

volumes:
  mysql-data:
