# Nginx on port 8080 serves the local frontend and proxies the APIs.
# Public API address is http://localhost:8080.
# /api/v1/auth/ goes to OpenID on 8081. /api/v1/children goes to the farm API on 8082.
# Account and farm rows live in MySQL. docker compose down keeps that data.
# docker compose down -v deletes the MySQL volume.
# From this directory: docker compose up --build
# Push after docker login: docker compose push
# Override secrets by copying .env.example to .env.
#
# Images:
#   jiandao/kiddoquest-happy-learning-farm-backend-mysql
#   jiandao/kiddoquest-happy-learning-farm-backend-openidsec
#   jiandao/kiddoquest-happy-learning-farm-backend-data
#   jiandao/kiddoquest-happy-learning-farm-backend-gateway

services:
  mysql:
    build:
      context: ./mysql
    image: jiandao/kiddoquest-happy-learning-farm-backend-mysql
    pull_policy: build
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  openid:
    build:
      context: ./backend-openID/backend
    image: jiandao/kiddoquest-happy-learning-farm-backend-openidsec
    pull_policy: build
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-PT12H}
      # Public OAuth client id, same value as frontend/common/cloud-config.js. Not a secret.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-669511875089-psnjdrjcfl3v8pc7kktm11bu8a3aau7p.apps.googleusercontent.com}
      OPENID_DB_URL: jdbc:mysql://mysql:3306/kiddoquest_openid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      OPENID_DB_USERNAME: root
      OPENID_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  farm:
    build:
      context: ./backend-data/backend
    image: jiandao/kiddoquest-happy-learning-farm-backend-data
    pull_policy: build
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-not-for-production-32b}
      AUTH_JWT_ISSUER: http://localhost:8080
      AUTH_JWT_AUDIENCE: kiddoquest
      FARM_DB_URL: jdbc:mysql://mysql:3306/kiddoquest_farm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      FARM_DB_USERNAME: root
      FARM_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kiddoquest-local}
    depends_on:
      mysql:
        condition: service_healthy
      openid:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: jiandao/kiddoquest-happy-learning-farm-backend-gateway
    pull_policy: build
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - openid
      - farm
    restart: unless-stopped

volumes:
  mysql-data:
